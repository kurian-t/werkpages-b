name: Full suite (manual)

# Everything routine CI leaves out. Expensive by design, and dispatched rather than pushed.
#
#   routine CI   compile, unit tests, and the "critical" integration tag (~152 tests)
#   this         every integration test in both modules (~2,000)
#
# The integration suite needs Docker for Testcontainers and takes well over the routine job's
# budget, which is why it is not on push.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Which module"
        required: true
        default: "all"
        type: choice
        options: [all, Api, RestApi]
      groups:
        description: "Optional JUnit tag filter, e.g. critical. Blank runs everything."
        required: false
        type: string

permissions:
  contents: read

jobs:
  full:
    name: Full backend suite
    timeout-minutes: 120
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # AN ARRAY, AND THE TAG FILTER ARRIVES THROUGH THE ENVIRONMENT.
      #
      # `groups` is a free-text input. Pasted directly into the script it is shell syntax rather
      # than data, so a value containing a space or a quote changes how bash parses the line.
      # Read from the environment it is only ever an argument. `module` is a choice input and so
      # already constrained, but it goes the same way for consistency.
      - name: Run
        run: |
          set -o pipefail
          ARGS=(-B -ntp verify -DskipITs=false -Ddocker.host=unix:///var/run/docker.sock)
          if [ "$MODULE" != "all" ]; then ARGS+=(-pl "$MODULE" -am); fi
          if [ -n "$GROUPS_INPUT" ]; then ARGS+=("-Dgroups=$GROUPS_INPUT"); fi
          echo "mvn ${ARGS[*]}"
          mvn "${ARGS[@]}"
        env:
          MODULE: ${{ inputs.module }}
          GROUPS_INPUT: ${{ inputs.groups }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: full-backend-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 30
