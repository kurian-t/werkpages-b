<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <!-- Load Swagger UI CSS from Webjar -->
    <link rel="stylesheet" href="/swagger/webjars/swagger-ui/4.18.2/swagger-ui.css">
    <link rel="icon" type="image/png" href="/swagger/webjars/swagger-ui/4.18.2/favicon-32x32.png">
</head>
<body>
<div id="swagger-ui"></div>

<!-- Load Swagger UI JS from Webjar -->
<script src="/swagger/webjars/swagger-ui/4.18.2/swagger-ui-bundle.js"></script>
<script src="/swagger/webjars/swagger-ui/4.18.2/swagger-ui-standalone-preset.js"></script>

<script>
    window.onload = function() {
        // Initialize Swagger UI
        const ui = SwaggerUIBundle({
            url: "/openapi.yaml",  // <- your OpenAPI spec
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "StandaloneLayout"
        });
        window.ui = ui;
    };
</script>
</body>
</html>
