      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Manager deleted
        '403':
          description: Forbidden
        '404':
          description: Manager not found
    put:
      operationId: adminEditManager
      summary: Admin-only direct edit of name, title, company, and LinkedIn with cascade to reviews and career history
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                title:
                  type: string
                company:
                  type: string
                linkedinUrl:
                  type: string
      responses:
        '200':
          description: Manager updated
