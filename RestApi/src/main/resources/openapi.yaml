            type: number
        linkedinUrl:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        careerHistory:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              title:
                type: string
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
                nullable: true

    ManagerReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        managerId:
          type: integer
        author:
          type: string
        overallRating:
          type: number
          minimum: 0
          maximum: 5
        ratings:
          type: object
          properties:
            communication_style:
              type: number
            perceived_approachability:
              type: number
            perceived_clarity_of_expectations:
              type: number
            feedback_style:
              type: number
            perceived_supportiveness:
              type: number
            decision_making_style:
              type: number
            organization_and_planning_style:
              type: number
            delegation_style:
              type: number
            perceived_professional_demeanor:
              type: number
            overall_working_experience:
              type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
          description: "YYYY-MM date the reviewer started working with this manager"
        workedUntil:
          type: string
          nullable: true
          description: "YYYY-MM date the reviewer stopped working with this manager (null = current)"
        managerRoleStart:
          type: string
          nullable: true
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        verified:
          type: boolean
        helpfulCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ManagerReviewInput:
      type: object
      required:
        - author
        - ratings
        - managerCompany
        - managerTitle
      properties:
        author:
          type: string
        authorType:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        overallRating:
          type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
        workedUntil:
          type: string
          nullable: true
        managerRoleStart:
          type: string
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        draftToken:
          type: string
          format: uuid
          description: Client-generated UUID from a previous drop-off; matching anonymous review is deleted before inserting this one

    ManagerReviewUpdate:
      type: object
      required:
        - overallRating
        - ratings
        - managerCompany
        - managerTitle
      properties:
        overallRating:
          type: number
        authorType:
          type: string
        author:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
        workedUntil:
          type: string
          nullable: true
        managerRoleStart:
          type: string
          nullable: true
        managerRoleEnd:
          type: string
          nullable: true

    User:
      type: object
      required:
        - id
        - email
        - username
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal database UUID
        auth0Id:
          type: string
          description: Auth0 user ID
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [admin, user]
        isBanned:
          type: boolean
        hasContributed:
          type: boolean
          description: True if the user has submitted at least one review

    SignupRequest:
      type: object
      required:
        - email
        - username
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string

    SigninRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email address or username
        password:
          type: string

    SigninResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/User'

    SignoutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    ManagerReviewUpdated:
      allOf:
        - $ref: '#/components/schemas/ManagerReview'
        - type: object
          properties:
            updatedAt:
              type: string
              format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT