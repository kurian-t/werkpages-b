        '404':
          description: No such employment

  /api/admin/moderation/employments/{roleId}/correct:
    post:
      operationId: adminModerationCorrectEmployment
      summary: Correct a canonical employment's title or dates, leaving every contributor's
        assertion untouched, and optionally accept it in the same transaction
      description: >-
        The employer cannot be changed here. reviews_withdrawn_role_is_the_managers ties a held
        rating to (withdrawn_role_id, manager_id) without company_id, so changing a role's company
        would silently re-attribute that rating with no constraint objecting; employer changes
        belong to the supersession design. A key's PRESENCE is what selects a field, so
        "endDate": null records "no recorded end date" while omitting endDate leaves it alone.
      tags:
        - Admin
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                title:
                  type: string
                startDate:
                  type: string
                  nullable: true
                  description: YYYY-MM-DD or YYYY-MM. Null clears it.
                endDate:
                  type: string
                  nullable: true
                  description: Null means no recorded end date, which is not the same as an
                    unknown period.
                periodKnown:
                  type: boolean
                  description: False means nobody has established when this employment was.
                reason:
                  type: string
                  description: Recorded in role_corrections. Required.
                thenAccept:
                  type: boolean
                  description: Accept in the same transaction, so the employment is never briefly
                    live with the values just corrected.
      responses:
        '200':
          description: Corrected
        '400':
          description: No reason, nothing changed, an impossible period, or not correctable
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such employment
        '409':
          description: The correction would duplicate an employment that already exists

  /api/admin/moderation/employments/{roleId}/reopen:
    post:
      operationId: adminModerationReopenEmployment
      summary: Reopen a rejected employment as a fresh proposal, publishing nothing
      description: >-
        Inserts a new proposed row carrying reopened_from, so the rejection stays on the record.
        No rating is republished: the new row has no claims, so rating_role_is_publishable has
        nothing to say yes to, and releasing held ratings remains the separate act of linking each
        claim to the new employment.
      tags:
        - Admin
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Reopened as a fresh proposal
        '400':
          description: Not a rejected employment, or no reason given
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such employment
        '409':
          description: A live employment for the same job already exists

  /api/admin/moderation/employments/{roleId}/history:
    get:
      operationId: adminModerationEmploymentHistory
      summary: One page of everything that has happened to this employment, in one timeline
      description: >-
        Reads role_corrections, claim_corrections, claim_resolution_events, manager_merge_events,
        review_supersessions, company_merges and role_conflicts. No contributor identity is
        selected: every actor is an administrator, resolved to a username, and an erased actor
        reads as withdrawn rather than as absent.
      tags:
        - Admin
      parameters:
        - in: path
          name: roleId
          required: true
          schema:
            type: integer
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: nextCursor from a previous page. Keyset over (at, kind, source id), so it
            cannot skip or repeat an event while new ones arrive.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: >-
            One page. lineageComplete answers whether every predecessor employment was found and
            is decided by cycle detection; hasMore answers whether every event was returned and
            is decided by the page size. The two are never conflated, and a partial timeline is
            never labelled complete.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such employment

  /api/admin/moderation/conflicts:
    get:
      operationId: adminModerationConflicts
      summary: Open role conflicts, blocking ones first (admin only)
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        '200':
          description: Open conflicts
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/moderation/conflicts/{conflictId}:
    get:
      operationId: adminModerationConflictDetail
      summary: One conflict with every attached claim and its role in the dispute
      description: >
        Each claim also carries what its contributor says NOW - the latest testimony rather than
        the claim's frozen assertion - and whether it has since been withdrawn, because a
        withdrawn claim grounds no status. For an employment_status_dispute the response adds
        caseEmployments: every accepted employment record under the dispute's case, with what each
        currently answers and whether a determination would move it. It is empty for every other
        kind, which decides only the role the conflict names.
      tags:
        - Admin
      parameters:
        - in: path
          name: conflictId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Conflict detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such conflict

  /api/admin/moderation/conflicts/{conflictId}/resolve:
    post:
      operationId: adminModerationResolveConflict
      summary: Record a decision on a conflict and release what it was holding
      tags:
        - Admin
      parameters:
        - in: path
          name: conflictId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  enum:
                    - merged
                    - kept_separate
                    - corrected
                    - dismissed
                    - superseded_the_legacy
                note:
                  type: string
      responses:
        '200':
          description: Resolved
        '400':
          description: Unknown resolution
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such conflict

  /api/admin/moderation/conflicts/{conflictId}/determine-status:
    post:
      operationId: adminModerationDetermineStatus
      summary: Answer an employment-status dispute and take the employment out of disputed
      description: >
        Applies one determination to every disputed employment record under the dispute's case,
        records it with basis 'moderator' and the moderator's identity, and resolves the dispute
        as status_determined. An asserting status must carry the date its evidence speaks to;
        'unknown' must not, because it asserts nothing. No rating changes state: an
        employment-status dispute never held one.
      tags:
        - Admin
      parameters:
        - in: path
          name: conflictId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - note
              properties:
                status:
                  type: string
                  enum:
                    - ongoing
                    - ended
                    - unknown
                asOf:
                  type: string
                  format: date
                  nullable: true
                  description: >
                    The date the evidence speaks to, not the date of the decision. Required for
                    'ongoing' and 'ended', and forbidden for 'unknown'.
                note:
                  type: string
                  description: Why. A determination overrides what contributors said.
      responses:
        '200':
          description: Determined
        '400':
          description: Unknown status, a missing or future evidence date, or a missing reason
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such conflict

  /api/admin/moderation/claims/{claimId}/link:
    post:
      operationId: adminModerationLinkClaim
      summary: Point a claim at an existing employment, preserving what the contributor selected
      tags:
