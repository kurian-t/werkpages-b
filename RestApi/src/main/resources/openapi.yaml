openapi: 3.0.3
info:
  title: RateMyManager API
  version: 1.0.0
servers:
  - url: http://localhost:8888
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user session management
  - name: Managers
    description: Manager profiles, reviews, and edit requests
  - name: Admin
    description: Admin-only management operations
  - name: Users
    description: User-specific operations
  - name: Notifications
    description: In-app notifications
  - name: Stats
    description: Site-wide statistics
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: Create a new user account
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/check-username:
    get:
      operationId: checkUsername
      summary: Check if a username is available
      tags:
        - Auth
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
        '400':
          description: Missing or invalid username

  /api/auth/signin:
    post:
      operationId: signin
      summary: Authenticate a user and return JWT
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/signout:
    post:
      operationId: signout
      summary: Sign out user (invalidate session)
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me:
    get:
      operationId: me
      summary: Get current authenticated user info
      tags:
        - Auth
      responses:
        '200':
          description: Returns the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (missing/invalid JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me/delete:
    delete:
      operationId: deleteMe
      summary: Delete the authenticated user's account and anonymize their reviews
      tags:
        - Auth
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/callback:
    post:
      operationId: socialAuthCallback
      summary: Exchange an OAuth authorization code for a session (social login)
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code:
                  type: string
                redirectUri:
                  type: string
      responses:
        '200':
          description: Authentication successful — sets auth_token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
        '400':
          description: Missing code or no email from provider
        '401':
          description: Token exchange failed

  /api/users/me/reviews:
    get:
      operationId: getMyReviews
      summary: Get all reviews written by the authenticated user
      tags:
        - Users
      responses:
        '200':
          description: List of reviews with manager info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'

  /api/users/me/submitted-managers:
    get:
      operationId: getMySubmittedManagers
      summary: Get managers submitted by the authenticated user (pending/rejected)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of submitted managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/users/me/has-contributed:
    get:
      operationId: hasContributed
      summary: Check if the authenticated user has at least one approved review
      tags:
        - Users
      responses:
        '200':
          description: Contribution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasContributed:
                    type: boolean

  /api/stats:
    get:
      operationId: getStats
      summary: Get site-wide stats (total managers and reviews)
      tags:
        - Stats
      security: []
      responses:
        '200':
          description: Site-wide stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalManagers:
                    type: integer
                  totalReviews:
                    type: integer

  /api/companies/listing:
    get:
      operationId: getCompanyListing
      summary: Get company listing with stats (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of companies with manager count, review count, and avg rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        logoUrl:
                          type: string
                        managerCount:
                          type: integer
                        totalReviews:
                          type: integer
                        avgRating:
                          type: number

  /api/companies/by-name:
    get:
      operationId: getCompanyProfile
      summary: Get company profile with aggregated stats and manager list (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: company
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  logoUrl:
                    type: string
                  managerCount:
                    type: integer
                  totalReviews:
                    type: integer
                  avgRating:
                    type: number
                  categoryAverages:
                    type: object
                  managers:
                    type: array
                    items:
                      type: object
        '400':
          description: company parameter missing
        '404':
          description: Company not found

  /api/companies:
    get:
      operationId: getCompanies
      summary: Get distinct company names (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of distinct company names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /api/companies/suggest:
    get:
      operationId: suggestCompanies
      summary: Suggest company names matching a query (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching company suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    logoUrl:
                      type: string

  /api/geo:
    get:
      operationId: getGeo
      summary: Resolve the visitor's country/state/city from Cloudflare headers (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: Visitor geo (any field may be null off Cloudflare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    nullable: true
                  state:
                    type: string
                    nullable: true
                  city:
                    type: string
                    nullable: true

  /api/managers/similar:
    get:
      operationId: getSimilarManagers
      summary: Find similar managers for duplicate detection (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: company
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of similar managers
          content:
            application/json:
              schema:
                type: object

  /api/managers/find-or-create:
    post:
      operationId: findOrCreateManager
      summary: Search for a manager by structured fields; auto-creates one on first search if not found (auth required)
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - title
                - company
                - country
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                company:
                  type: string
                country:
                  type: string
                state:
                  type: string
                city:
                  type: string
      responses:
        '200':
          description: Search results (may include a newly created manager)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  created:
                    type: boolean

  /api/managers/ghost:
    post:
      operationId: createGhostManager
      summary: Capture manager intent as a ghost record — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                city:
                  type: string
      responses:
        '200':
          description: Existing manager found — no new record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean
        '201':
          description: New ghost manager created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean

  /api/managers/anonymous-capture:
    post:
      operationId: captureAnonymousSearch
      summary: Silently create a pending_approval manager from an anonymous search — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                city:
                  type: string
      responses:
        '202':
          description: Accepted — pending manager queued for admin review (nothing returned to caller)
        '400':
          description: Validation error

  /api/managers/drop-off:
    post:
      operationId: createDropOffDraft
      summary: Capture full drop-off form data (manager + review) without authentication
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
                - review
              properties:
                name:
                  type: string
                company:
                  type: string
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                status:
                  type: string
                  enum: [active, retired]
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID linking this drop-off draft to a future authenticated submit for deduplication
                review:
                  type: object
                  required:
                    - author
                    - overallRating
                    - ratings
                    - workedFrom
                    - managerCompany
                    - managerTitle
                  properties:
                    author:
                      type: string
                    overallRating:
                      type: number
                    ratings:
                      type: object
                    workedFrom:
                      type: string
                    workedUntil:
                      type: string
                    managerCompany:
                      type: string
                    managerTitle:
                      type: string
      responses:
        '200':
          description: Manager already existed — review attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean
        '201':
          description: New pending manager created with review
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean

  /api/managers:
    get:
      operationId: getManagers
      summary: List managers (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: search
          schema:
            type: string
          description: Optional. Case-insensitive search across name, company, and title.
        - in: query
          name: company
          schema:
            type: string
          description: Optional. Filter by exact company name (case-insensitive).
      responses:
        '200':
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer

    post:
      operationId: createManager
      summary: Create a new manager
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - image
                - status
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                  nullable: true
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID from drop-off draft; matching anonymous review is deleted before inserting the authenticated one
      responses:
        '201':
          description: Manager created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'

  /api/managers/{id}:
    get:
      operationId: getManagerById
      summary: Get a single manager profile (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '404':
          description: Manager not found

    put:
      operationId: updateManager
      summary: Update any writeable manager fields and optionally track career history
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                company:
                  type: string
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                country:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                  nullable: true
                overallRating:
                  type: number
                  minimum: 0
                  maximum: 5
                reviews:
                  type: integer
                  minimum: 0
                categoryAverages:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: Manager updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '400':
          description: Nothing to update
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found

  /api/managers/{id}/recalculate:
    put:
      operationId: recalculateManagerStats
      summary: Recalculate and persist a manager's overall_rating, reviews_count, and category_averages
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The manager ID to recalculate stats for
      responses:
        '200':
          description: Manager stats recalculated and updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/reviews:
    post:
      operationId: createManagerReview
      summary: Submit a new review for a manager
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerReviewInput'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerReview'
        '404':
          description: Manager not found
    get:
      operationId: getManagerReviews
      summary: Get all reviews for a manager (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [recent, helpful, highest, lowest]
            default: recent
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
          description: Optional. When provided, returns only reviews written by this user.
      responses:
        '200':
          description: Paginated list of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid userId format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/reviews/drop-off:
    post:
      operationId: createDropOffReview
      summary: Capture a review drop-off for an existing manager without authentication
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ratings
                - managerCompany
                - managerTitle
                - workedFrom
              properties:
                author:
                  type: string
                overallRating:
                  type: number
                ratings:
                  type: object
                managerCompany:
                  type: string
                managerTitle:
                  type: string
                workedFrom:
                  type: string
                workedUntil:
                  type: string
                  nullable: true
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID linking this drop-off draft to a future authenticated submit for deduplication
      responses:
        '200':
          description: Drop-off review recorded
        '400':
          description: Invalid request

  /api/managers/{id}/career-segments:
    get:
      operationId: getManagerCareerSegments
      summary: Get pre-aggregated career segments for the timeline (all reviews, grouped by company+role)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aggregated career segments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        company:
                          type: string
                        role:
                          type: string
                        startDate:
                          type: string
                          nullable: true
                        endDate:
                          type: string
                          nullable: true
                        isCurrent:
                          type: boolean
                        averageRating:
                          type: number
                        reviewCount:
                          type: integer
                        categoryAverages:
                          type: object
                          additionalProperties:
                            type: number
        '400':
          description: Invalid manager ID

  /api/managers/{id}/report:
    post:
      operationId: reportManager
      summary: Report an inaccurate or incorrect manager profile
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum: [incorrect_person, never_worked_here, duplicate_profile, incorrect_information, other]
                comment:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Report submitted successfully
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/edit-requests:
    post:
      operationId: createManagerEditRequest
      summary: Submit a pending edit request for a manager's company/title
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: Edit request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          description: Validation error
        '404':
          description: Manager not found

  /api/managers/{id}/pending-edits:
    get:
      operationId: getManagerPendingEdits
      summary: Get pending edit requests for a manager (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of pending edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
