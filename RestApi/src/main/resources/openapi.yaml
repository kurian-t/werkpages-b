      description: >
        Severs the contributor's ownership of their rating permanently. The rating REMAINS
        published as anonymous feedback and its scores continue contributing to statistics -
        this is not a deletion and there is no withdrawal window. A private participation
        record is kept so the account cannot rate this manager again. Irreversible.
      tags:
