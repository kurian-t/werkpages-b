      operationId: adminMergeCompanies
      summary: Merge a duplicate company into another (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: keepId
          required: true
          schema:
            type: integer
        - in: path
          name: mergeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Merge successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Company not found

  /api/admin/managers/{keepId}/merge/{mergeId}:
