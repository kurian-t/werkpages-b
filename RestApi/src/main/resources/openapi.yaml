          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Manager not found

  /api/admin/companies:
    get:
      operationId: adminListCompanies
      summary: List all companies for the admin panel
      tags:
        - Admin
      responses:
        '200':
          description: List of companies
        '403':
          description: Forbidden

  /api/admin/companies/{companyId}:
    put:
      operationId: adminRenameCompany
      summary: Rename a company and cascade to all linked records (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Rename successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '409':
          description: Name already taken — use the merge tool

  /api/admin/companies/{keepId}/merge/{mergeId}:
    post:
      operationId: adminMergeCompanies
      summary: Merge a duplicate company into another (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: keepId
          required: true
          schema:
            type: integer
        - in: path
          name: mergeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Merge successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Company not found

  /api/admin/managers/{keepId}/merge/{mergeId}:
    post:
      operationId: mergeManagers
      summary: Merge a duplicate manager into another (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: keepId
          required: true
          schema:
            type: integer
        - in: path
          name: mergeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Merge successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Manager not found

  /api/notifications:
    get:
      operationId: getNotifications
      summary: Get notifications for the authenticated user
      tags:
        - Notifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /api/notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      summary: Get count of unread notifications
      tags:
        - Notifications
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
        '401':
          description: Unauthorized

  /api/notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      tags:
        - Notifications
      responses:
        '200':
          description: All notifications marked as read
        '401':
          description: Unauthorized

  /api/notifications/{id}/read:
    put:
      operationId: markNotificationRead
      summary: Mark a single notification as read
      tags:
        - Notifications
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
        '401':
          description: Unauthorized

  /api/managers/{managerId}/reviews/{reviewId}:
    put:
      operationId: updateManagerReview
      summary: Update an existing review
      tags:
        - Managers
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerReviewUpdate'
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerReviewUpdated'
        '404':
          description: Review not found

    delete:
      operationId: deleteManagerReview
      summary: Delete a review
      tags:
        - Managers
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review deleted
        '401':
          description: Unauthorized
        '404':
          description: Review not found

  /api/managers/{managerId}/reviews/{reviewId}/replace:
    post:
      operationId: replaceManagerReview
      summary: Replace an existing review with a new one (no cooldown recorded)
      tags:
        - Managers
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerReview'
      responses:
        '200':
          description: Review replaced successfully
        '401':
          description: Unauthorized
        '404':
          description: Review not found

components:
  schemas:
    ManagerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        country:
          type: string
          nullable: true

    ManagerDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        bio:
          type: string
        status:
          type: string
          enum: [active, retired]
        categoryAverages:
          type: object
          additionalProperties:
            type: number
        linkedinUrl:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        careerHistory:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              title:
                type: string
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
                nullable: true

    ManagerReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        managerId:
          type: integer
        author:
          type: string
        overallRating:
          type: number
          minimum: 0
          maximum: 5
        ratings:
          type: object
          properties:
            communication_style:
              type: number
            perceived_approachability:
              type: number
            perceived_clarity_of_expectations:
              type: number
            feedback_style:
              type: number
            perceived_supportiveness:
              type: number
            decision_making_style:
              type: number
            organization_and_planning_style:
              type: number
            delegation_style:
              type: number
            perceived_professional_demeanor:
              type: number
            overall_working_experience:
              type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
          description: "YYYY-MM date the reviewer started working with this manager"
        workedUntil:
          type: string
          nullable: true
          description: "YYYY-MM date the reviewer stopped working with this manager (null = current)"
        managerRoleStart:
          type: string
          nullable: true
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        verified:
          type: boolean
        helpfulCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ManagerReviewInput:
      type: object
      required:
        - author
        - ratings
        - managerCompany
        - managerTitle
      properties:
        author:
          type: string
        authorType:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        overallRating:
          type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
        workedUntil:
          type: string
          nullable: true
        managerRoleStart:
          type: string
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        draftToken:
          type: string
          format: uuid
          description: Client-generated UUID from a previous drop-off; matching anonymous review is deleted before inserting this one

    ManagerReviewUpdate:
      type: object
      required:
        - overallRating
        - ratings
        - managerCompany
        - managerTitle
      properties:
        overallRating:
          type: number
        authorType:
          type: string
        author:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        workedFrom:
          type: string
          nullable: true
        workedUntil:
          type: string
          nullable: true
        managerRoleStart:
          type: string
          nullable: true
        managerRoleEnd:
          type: string
          nullable: true

    User:
      type: object
      required:
        - id
        - email
        - username
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal database UUID
        auth0Id:
          type: string
          description: Auth0 user ID
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required:
        - email
        - username
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string

    SigninRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email address or username
        password:
          type: string

    SigninResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/User'

    SignoutResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean

    ManagerReviewUpdated:
      allOf:
        - $ref: '#/components/schemas/ManagerReview'
        - type: object
          properties:
            updatedAt:
              type: string
              format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT