        '404':
          description: Ghost manager not found

  # ── Role-aware moderation (Rev 268 phase 4C) ──────────────────────────────
  #
  # Admin only, enforced in ModerationService: every method resolves the caller
  # through AdminService.requireAdminPublic before touching a row, so a
  # hand-built request gets the same 401 or 403 as a misdirected click.
  #
  # Deliberately NOT gated on ROLE_AWARE_SUBMISSION_ENABLED. Role conflicts and
  # held ratings are created by the manager merge, which is not behind that
  # flag, so a queue can exist while public role-aware submission is off. An
  # admin must be able to clear it.
  /api/admin/moderation/summary:
    get:
      operationId: adminModerationSummary
      summary: Counts and oldest-waiting ages for every moderation queue (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: Queue summary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/moderation/employments:
