components:
  schemas:
    ContributionDraft:
      type: object
      description: >-
        An unfinished rating belonging to the authenticated contributor. Carries no moderation
        state and no capture token: a contributor reading their own draft is not reading the
        review queue.
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum: [manager, company, interview]
        subjectId:
          type: integer
          format: int64
        ordinal:
          type: integer
        payload:
          type: object
        version:
          type: integer
          format: int64
        savedAt:
          type: string
        expiresAt:
          type: string
          description: When the retention period removes it, so expiry is never a surprise.
        available:
          type: boolean
          description: Whether the subject can still be rated.
        unavailableReason:
          type: string
        redirectTo:
          type: integer
          format: int64
          description: The surviving subject, when this one was merged into another.
    RoleCoverage:
      type: object
      properties:
        distinctTitles:
          type: integer
        classifiedTitles:
          type: integer
        remaining:
          type: integer
        managersTotal:
          type: integer
        managersWithFamily:
          type: integer
        managersWithSeniority:
          type: integer
        familyCoveragePct:
          description: Coverage counted by manager, not by title — a title ten thousand people hold matters more than a hundred one-offs.
          type: integer
        seniorityCoveragePct:
          type: integer

    RoleAliasListing:
      allOf:
        - $ref: '#/components/schemas/RoleCoverage'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  titleNormalized:
                    type: string
                  roleFamily:
                    type: string
                    nullable: true
                  seniority:
                    type: string
                    nullable: true
                  source:
                    type: string
                    enum: [rule, ai, manual]
                  managerCount:
                    type: integer
                  sampleTitle:
                    description: One real title that normalized to this row, so the mapping can be sanity-checked against what someone actually typed.
                    type: string
                    nullable: true

    # ── Interview experience reviews ──────────────────────────────────────────

    InterviewRating:
      type: number
      format: double
      minimum: 0
      maximum: 5
      nullable: true

    CompanyRatingRequest:
      type: object
      required: [overallRating, ratings, workedFrom]
      properties:
        overallRating:
          type: number
          minimum: 0
          maximum: 5
          description: >-
            Asked explicitly and stored as given: "the pay was poor and it was chaotic, but I
            loved working there" is a real position, and it is kept. It is averaged WITH the ten
            below rather than replacing them, so a summary judgement counts once among eleven
            instead of being the whole figure.
        ratings:
          type: object
          description: All ten are required. There is no N/A - see the migration for why.
          required:
            - work_life_balance
            - compensation_benefits
            - career_growth
            - job_security
            - workload_sustainability
            - senior_leadership
            - company_communication
            - flexibility
            - inclusion_belonging
            - tools_resources
          properties:
            work_life_balance:       { type: number, minimum: 0, maximum: 5 }
            compensation_benefits:   { type: number, minimum: 0, maximum: 5 }
            career_growth:           { type: number, minimum: 0, maximum: 5 }
            job_security:            { type: number, minimum: 0, maximum: 5 }
            workload_sustainability: { type: number, minimum: 0, maximum: 5 }
            senior_leadership:       { type: number, minimum: 0, maximum: 5 }
            company_communication:   { type: number, minimum: 0, maximum: 5 }
            flexibility:             { type: number, minimum: 0, maximum: 5 }
            inclusion_belonging:     { type: number, minimum: 0, maximum: 5 }
            tools_resources:         { type: number, minimum: 0, maximum: 5 }
        datesHidden:
          type: boolean
          default: false
          description: >-
            Do not publish the period worked at this company. Opt-in: omitted means show. The
            dates stay required and stored - the form reopens on them - so only the display is
            withheld. Mirrors the same field on a manager rating.
        workedFrom:
          type: string
          description: YYYY-MM. An employer in 2019 says little about it now, so the period is data.
        workedUntil:
          type: string
          nullable: true
          description: YYYY-MM, or null while still there.
        author:
          type: string
          nullable: true
          maxLength: 60
          description: >-
            The randomly generated handle the author picked, the way a manager review is signed.
            Anonymous but consistent, so a page of several ratings reads as several people rather
            than one voice repeated. Null leaves the rating unsigned.
        draftToken:
          type: string
          format: uuid
          description: >-
            The token of the captured draft this rating came from. Sending it deletes that draft,
            so an admin does not review work the author came back and finished.
        declaredCountry:
          type: string
          nullable: true
          description: >-
            Where the work happened, on the same ladder every contribution uses. Ten Walmarts in
            one city can be ten different places to work, so a rating names a branch when the
            person knows it and a province when that is all they know.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
          description: >-
            Stated, not inferred from which fields happen to be filled. Omitted entirely on an
            edit, the stored location is kept rather than cleared.
        companyLocationId:
          type: integer
          format: int64
          nullable: true
        corpusPlace:
          type: object
          nullable: true
          description: A building chosen from the search corpus; promoted to a real location on submit.
          properties:
            sourcePlaceId: { type: string }
            name:          { type: string }
            brandName:     { type: string, nullable: true }
            street:        { type: string, nullable: true }
            city:          { type: string, nullable: true }
            stateCode:     { type: string, nullable: true }
            countryCode:   { type: string, nullable: true }
            postalCode:    { type: string, nullable: true }

    CompanyRating:
      type: object
      properties:
        companySlug:
          type: string
          description: >-
            The company the rating was actually filed against. Equal to the path company on an
            ordinary submission; different when the author changed the company on the form, since
            the named company wins over the page. Clients must send the reader here rather than
            back to the slug they posted to.
        companyName:
          type: string
          description: Name of that same company, so a follow-up prompt can name it.
        id:            { type: string, format: uuid }
        companyId:     { type: integer, format: int64 }
        overallRating:
          type: number
          description: >-
            THE RATING: the average of all eleven scores its author gave. Derived by the database;
            never sent by a client. Every endpoint means this by the name.
        authorsOverallRating:
          type: number
          nullable: true
          description: >-
            What its author answered when asked to sum it up themselves. One of the eleven
            averaged above, kept as data, and the value the rating form reopens on. Null when the
            reader is gated, with every other score.
        ratings:       { type: object }
        workedFrom:    { type: string, nullable: true }
        workedUntil:   { type: string, nullable: true }
        author:        { type: string, nullable: true }
        declaredCountry:   { type: string,  nullable: true }
        declaredState:     { type: string,  nullable: true }
        declaredCity:      { type: string,  nullable: true }
        declaredPrecision: { type: string,  nullable: true, enum: [country, state, city, exact] }
        companyLocationId: { type: integer, nullable: true, format: int64 }

    InterviewReviewRequest:
      type: object
      required:
        - overallRating
        - outcome
        - interviewYear
      properties:
        author:
          type: string
          nullable: true
          maxLength: 60
          description: >-
            The randomly generated handle the author picked, as a manager review and a workplace
            rating both carry. Anonymous but consistent, so several accounts of one company read as
            several people. Null leaves the experience unsigned.
        overallRating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        communication:
          $ref: '#/components/schemas/InterviewRating'
        respectForTime:
          $ref: '#/components/schemas/InterviewRating'
        roleClarity:
          $ref: '#/components/schemas/InterviewRating'
        processFairness:
          $ref: '#/components/schemas/InterviewRating'
        nextStepTransparency:
          $ref: '#/components/schemas/InterviewRating'
        difficulty:
          description: >-
            1-5, where 5 is hardest. NOT a quality score - a hard interview is not a bad one, so
            this is never folded into overallRating or any "top rated" ranking.
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        outcome:
          description: >-
            Required. Rejected candidates rate a process markedly lower than hired ones, so an
            average that mixes them measures who was most annoyed rather than how the company
            interviews. Collecting it lets the company page show the split instead.
          type: string
          enum: [offer, no_offer, withdrew, pending]
        rounds:
          description: >-
            The shape of the process, in order — "phone screen, then a panel, then a VP
            conversation". Replaces V48's single interviewType plus a count, which could not
            express ordering or more than one format. The count on the stored review is derived
            from this list.
          type: array
          maxItems: 10
          items:
            type: string
            enum: [recruiter_screen, phone, video, hiring_manager, technical, take_home,
                   pair_programming, case_study, panel, onsite, executive]
        processLength:
          type: string
          enum: [under_1_week, 1_2_weeks, 2_4_weeks, over_1_month]
          nullable: true
        roleCategory:
          type: string
          maxLength: 100
          nullable: true
        country:
          description: >-
            Country of the POSITION, not where the candidate lives. Someone in Toronto interviewing
            for a US role went through the US process, and that is what comparisons are about.
            Prefilled from the request's geo headers; the person can change it.
          type: string
          maxLength: 100
          nullable: true
        city:
          description: >-
            Inferred from geo rather than asked for, and cleared when the country is changed away
            from the inferred one. Captured but not yet exposed as a filter: city-level slices need
            sample sizes the site does not have.
          type: string
          maxLength: 100
          nullable: true
        interviewYear:
          description: Hiring processes track the market closely, so year is a filtering axis.
          type: integer
        draftToken:
          type: string
          format: uuid
          description: >-
            The token of the captured draft this experience came from. Sending it deletes that
            draft, so an admin does not review work the author came back and finished.
        interviewedFrom:
          type: string
          nullable: true
          description: >-
            Month the process started, as YYYY-MM. The same range the manager and workplace forms
            ask for. interviewYear is derived from it when present.
        interviewedUntil:
          type: string
          nullable: true
          description: >-
            Month it finished, as YYYY-MM. May equal interviewedFrom - a single-day process is one
            interview, not a malformed range.
        declaredCountry:
          type: string
          nullable: true
          description: Where the interviewing happened, on the same ladder every contribution uses.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
        companyLocationId:
          type: integer
          format: int64
          nullable: true
        corpusPlace:
          type: object
          nullable: true
          description: A building chosen from the search corpus; promoted to a real location on submit.
          properties:
            sourcePlaceId: { type: string }
            name:          { type: string }
            brandName:     { type: string, nullable: true }
            street:        { type: string, nullable: true }
            city:          { type: string, nullable: true }
            stateCode:     { type: string, nullable: true }
            countryCode:   { type: string, nullable: true }
            postalCode:    { type: string, nullable: true }

    InterviewReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        overallRating:
          type: number
          nullable: true
        communication:
          $ref: '#/components/schemas/InterviewRating'
        respectForTime:
          $ref: '#/components/schemas/InterviewRating'
        roleClarity:
          $ref: '#/components/schemas/InterviewRating'
        processFairness:
          $ref: '#/components/schemas/InterviewRating'
        nextStepTransparency:
          $ref: '#/components/schemas/InterviewRating'
        difficulty:
          type: integer
          nullable: true
        outcome:
          type: string
          enum: [offer, no_offer, withdrew, pending]
        rounds:
          description: Number of rounds, derived from the per-round detail.
          type: integer
          nullable: true
        processLength:
          type: string
          nullable: true
        roleCategory:
          type: string
          nullable: true
        interviewYear:
          type: integer
        interviewedFrom:
          type: string
          nullable: true
          description: >-
            Month the process started, as YYYY-MM. The same range the manager and workplace forms
            ask for. interviewYear is derived from it when present.
        interviewedUntil:
          type: string
          nullable: true
          description: >-
            Month it finished, as YYYY-MM. May equal interviewedFrom - a single-day process is one
            interview, not a malformed range.
        declaredCountry:
          type: string
          nullable: true
          description: Where the interviewing happened, on the same ladder every contribution uses.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
        companyLocationId:
          type: integer
          format: int64
          nullable: true
        corpusPlace:
          type: object
          nullable: true
          description: A building chosen from the search corpus; promoted to a real location on submit.
          properties:
            sourcePlaceId: { type: string }
            name:          { type: string }
            brandName:     { type: string, nullable: true }
            street:        { type: string, nullable: true }
            city:          { type: string, nullable: true }
            stateCode:     { type: string, nullable: true }
            countryCode:   { type: string, nullable: true }
            postalCode:    { type: string, nullable: true }

    InterviewCategorySeries:
      description: >-
        One population's ratings. A series nobody falls into still appears, with null averages -
        "nobody who was rejected has reported here" is information, and an absent key reads as zero.
      type: object
      properties:
        count:
          type: integer
        overallRating:
          type: number
          nullable: true
        communication:
          type: number
          nullable: true
        respectForTime:
          type: number
          nullable: true
        roleClarity:
          type: number
          nullable: true
        processFairness:
          type: number
          nullable: true
        nextStepTransparency:
          type: number
          nullable: true

    InterviewOutcomeBucket:
      type: object
      properties:
        count:
          type: integer
        avgRating:
          type: number
          nullable: true

    CompanyInterviewStats:
      type: object
      properties:
        reviewCount:
          description: All interview reviews for the company, ignoring any filter. Always public.
          type: integer
        avgRating:
          type: number
          nullable: true
        avgDifficulty:
          type: number
          nullable: true
        medianRounds:
          type: integer
          nullable: true
        outcomeSplit:
          description: >-
            Every outcome is present, including ones with a zero count. An absent key and a zero
            count read the same to a caller checking truthiness but mean different things.
          type: object
          properties:
            offer:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            noOffer:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            withdrew:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            pending:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
        roleCategories:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              count:
                type: integer
        countries:
          description: Countries this company has interviews for, most reported first.
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              count:
                type: integer
        typicalRounds:
          description: >-
            The usual shape of this company's process, position by position. Mode per round rather
            than an average, because averaging formats is meaningless.
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
              type:
                type: string
              reportedBy:
                type: integer
        role:
          description: The role the comparison chart was narrowed to, or null for all roles.
          type: string
          nullable: true
        categoryComparison:
          description: >-
            Every category rated three ways at once - by everyone, by candidates who received an
            offer, and by those who did not. Null when withheld, on the same gate as
            categoryAverages. Narrowed by the role parameter.
          nullable: true
          type: object
          properties:
            overall:
              $ref: '#/components/schemas/InterviewCategorySeries'
            offer:
              $ref: '#/components/schemas/InterviewCategorySeries'
            noOffer:
              $ref: '#/components/schemas/InterviewCategorySeries'
        categoryAverages:
          description: >-
            Null when withheld. Two distinct reasons, distinguished by the flags below - gated
            (the viewer has not contributed) or belowThreshold (too few reviews to average).
          nullable: true
          type: object
          properties:
            communication:
              type: number
              nullable: true
            respectForTime:
              type: number
              nullable: true
            roleClarity:
              type: number
              nullable: true
            processFairness:
              type: number
              nullable: true
            nextStepTransparency:
              type: number
              nullable: true
        hasContributed:
          type: boolean
        gated:
          type: boolean
        belowThreshold:
          type: boolean
        myInterview:
          description: >-
            The caller's own review for this company, if signed in and they have one. Drives the
            ownership control: once you have contributed, the page offers to edit or remove what
            you wrote instead of asking again.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InterviewReview' 

    ManagerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        country:
          type: string
          nullable: true

    ManagerDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        bio:
          type: string
        status:
          type: string
          enum: [active, retired]
        categoryAverages:
          type: object
          additionalProperties:
            type: number
        linkedinUrl:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        careerHistory:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              title:
                type: string
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
                nullable: true

    ManagerReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        managerId:
          type: integer
        author:
          type: string
        overallRating:
          type: number
          minimum: 0
          maximum: 5
        ratings:
          type: object
          properties:
            communication_style:
              type: number
            perceived_approachability:
              type: number
            perceived_clarity_of_expectations:
              type: number
            feedback_style:
              type: number
            perceived_supportiveness:
              type: number
            decision_making_style:
              type: number
            organization_and_planning_style:
              type: number
            delegation_style:
              type: number
            perceived_professional_demeanor:
              type: number
            overall_working_experience:
              type: number
        managerCompany:
          type: string
        managerStatus:
          type: string
          nullable: true
          enum: [active, retired]
          description: >-
            Whether the manager was still in the role, as this reviewer knew it - snapshotted on
            the review like managerCompany and managerTitle. The manager's own status is derived
            from the most current review carrying one, so one contributor cannot overwrite
            another's answer. Omitted leaves the manager's status untouched; silence is not a claim
            that somebody retired.
        managerTitle:
          type: string
        declaredCountry:
          type: string
          nullable: true
          description: Where the contributor said this particular opinion happened.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
        companyLocationId:
          type: integer
          format: int64
          nullable: true
        datesHidden:
          type: boolean
          description: >-
            The author chose not to publish the period they worked under this manager. When true,
            workedFrom, workedUntil and effectiveWorkedUntil are all null on this view - the dates
            are still stored, but withheld on read. Also set automatically when an author
            withdraws their own rating, so the row returns dateless after the 3-day window.
        workedFrom:
          type: string
          nullable: true
          description: >-
            YYYY-MM date the reviewer started working with this manager. Null when datesHidden,
            or on a rating that never recorded one.
        workedUntil:
          type: string
          nullable: true
          description: "YYYY-MM date the reviewer stopped working with this manager (null = current)"
        effectiveWorkedUntil:
          type: string
          nullable: true
          description: >-
            workedUntil capped at the date the MANAGER left this role, per career history.
            Display reads this; the edit form and overlap checks read workedUntil, which is
            the reviewer's own answer and must never be overwritten with the capped value.
        managerRoleStart:
          type: string
          nullable: true
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        verified:
          type: boolean
        helpfulCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ManagerReviewInput:
      type: object
      required:
        - author
        - ratings
        - managerCompany
        - managerTitle
      properties:
        author:
          type: string
        authorType:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        overallRating:
          type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        datesHidden:
          type: boolean
          default: false
          description: >-
            Do not publish the working period. Opt-in: omitted means show, which is what every
            rating written before this field existed does. The dates are still required and still
            stored, because the overlap check and the tenure arithmetic read them back.
        workedFrom:
          type: string
          nullable: true
        workedUntil:
          type: string
          nullable: true
        managerRoleStart:
          type: string
          description: "YYYY-MM date the manager started this role"
        managerRoleEnd:
          type: string
          nullable: true
          description: "YYYY-MM date the manager left this role (null = still in role)"
        declaredCountry:
          type: string
          nullable: true
          description: Country the contributor confirmed for this opinion.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
          description: >
            How specific the declaration is. Stated rather than inferred from which fields happen
            to be filled. On an update, its ABSENCE means "leave the stored location alone" - an
            ordinary edit to the ratings must not move an opinion to wherever the manager works
            now.
        companyLocationId:
          type: integer
          format: int64
          nullable: true
          description: An existing company_locations row, at exact precision.
        corpusPlace:
          type: object
          nullable: true
          description: >
            A building chosen from the search corpus, which has no id yet. Sent instead of
            companyLocationId; the server promotes it to a real location on submit.
          properties:
            sourcePlaceId: { type: string }
            name:          { type: string }
            brandName:     { type: string, nullable: true }
            street:        { type: string, nullable: true }
            city:          { type: string, nullable: true }
            stateCode:     { type: string, nullable: true }
            countryCode:   { type: string, nullable: true }
            postalCode:    { type: string, nullable: true }
        draftToken:
          type: string
          format: uuid
          description: Client-generated UUID from a previous drop-off; matching anonymous review is deleted before inserting this one

    ManagerReviewUpdate:
      type: object
      required:
