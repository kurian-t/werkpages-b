      operationId: reclaimManagerSlug
      summary: Move a manager onto its plain name slug (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Whether the slug moved, and what it is now
        '403':
          description: Forbidden

  /api/admin/pending-managers/{managerId}/slug-preview:
    get:
      operationId: previewApprovalSlug
      summary: What approving this manager would do to its slug (admin only)
      description: >
        Pending managers hold a slug in the reserved "-pending" namespace so they cannot occupy
        the name a published manager would use. Approval moves them onto the clean name.


        This reports, before anything is approved, whether that name is free - and when it is not,
        which live manager holds it, so the panel can offer merging into that manager or publishing
        under a suggested alternative instead of the database silently appending a company.
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The slug this approval would take, and any conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  managerId:
                    type: integer
                    format: int64
                  currentSlug:
                    type: string
                  cleanSlug:
                    type: string
                  available:
                    type: boolean
                    description: False when a published manager already holds the clean slug.
                  suggestedSlug:
                    type: string
                    description: Present only when the clean slug is taken.
                  heldBy:
                    type: object
                    description: The published manager occupying the clean slug.
        '403':
          description: Forbidden
        '404':
          description: Manager not found

  /api/admin/pending-managers/{managerId}/approve:
    post:
      operationId: approvePendingManager
      summary: Approve a pending manager (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  type: string
                  description: >
                    The name to publish under, when an admin resolved a conflict. Omitted, the
                    clean slug is taken if free and the row is otherwise left where it is.
      responses:
        '200':
          description: Manager approved
        '403':
          description: Forbidden
        '404':
          description: Pending manager not found

  /api/admin/pending-managers/{managerId}/reject:
    post:
      operationId: rejectPendingManager
      summary: Reject a pending manager (admin only)
      description: >-
        The category decides consequences: only "junk" debits the submitter's confidence, because
        a duplicate or an administrative correction is not their fault. A search-created ghost is
        never debited whatever is chosen, since the person typed into a search box rather than
        submitting anything. An absent category means no penalty, so a caller predating it cannot
        apply one by accident.
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: >-
                    Free text shown to the submitter in the rejection notification. Does not
                    affect confidence.
                category:
                  type: string
                  enum: [junk, duplicate, correction, other]
                  description: >-
                    junk = fake or garbage submission (penalises the submitter);
                    duplicate and correction carry no penalty; other is a deliberate choice.
      responses:
        '200':
          description: Manager rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  category:
                    type: string
                    nullable: true
                  confidencePenalty:
                    type: boolean
                    description: >-
                      Whether this rejection actually debited anybody. Reported rather than
                      inferred from the category, which would be wrong for a search-created row.
        '400':
          description: Unrecognised category
        '403':
          description: Forbidden
        '404':
          description: Pending manager not found

  /api/admin/managers/{managerId}:
    delete:
      operationId: adminDeleteManager
      summary: Permanently delete a manager and all their reviews (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Manager deleted
        '403':
          description: Forbidden
        '404':
          description: Manager not found
    put:
      operationId: adminEditManager
      summary: Admin-only direct edit of name, title, company, and LinkedIn with cascade to reviews and career history
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                title:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so correcting a name
                # cannot silently mint a duplicate company.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                country:
                  type: string
                  nullable: true
                  description: Where the manager works. Omit to leave unchanged.
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                companyLocationId:
                  type: integer
                  nullable: true
                  description: >-
                    The exact place this manager works, from company_locations. Omit to leave
                    unchanged; send a negative value to clear it.
      responses:
        '200':
          description: Manager updated
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Manager not found

  /api/admin/companies:
    get:
      operationId: adminListCompanies
      summary: List all companies for the admin panel
      tags:
        - Admin
      responses:
        '200':
          description: List of companies
        '403':
          description: Forbidden

  /api/admin/reports:
    get:
      operationId: adminListReports
      summary: Reports filed against manager profiles, oldest open first (admin only)
      description: >-
        The read side of the Report button. Reports were written to the database from the day the
        button shipped and never read by anything but the duplicate check, so nobody could see one;
        this is the queue that makes them actionable. Open reports come oldest first, because the
        age is what matters.
      tags:
        - Admin
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, resolved, dismissed], default: open }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: One page of reports in the requested state
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:  { type: integer }
                  status: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        managerId:   { type: integer, format: int64 }
                        managerName: { type: string }
                        managerSlug: { type: string }
                        reason:
                          type: string
                          enum: [incorrect_person, never_worked_here, duplicate_profile, incorrect_information, other]
                        comment:     { type: string, nullable: true }
                        status:      { type: string, enum: [open, resolved, dismissed] }
                        createdAt:   { type: string, format: date-time }
                        reporter:
                          type: string
                          nullable: true
                          description: >-
                            The reporter's handle, or null when no account stands behind the report
                            any more. reports.user_id is ON DELETE SET NULL, so deleting an account
                            leaves its reports in the queue without a reporter.
                        reporterKnown:  { type: boolean }
                        resolvedAt:     { type: string, format: date-time, nullable: true }
                        resolvedBy:     { type: string, nullable: true }
                        resolutionNote: { type: string, nullable: true }
        '400':
          description: Unknown status
        '401':
          description: Unauthorized
        '403':
          description: Not an admin

  /api/admin/reports/{reportId}/resolve:
    post:
      operationId: adminResolveReport
      summary: Decide one report and take it out of the queue (admin only)
      description: >-
        Neither action deletes the report: it is evidence about a profile and about the account that
        filed it, and both outlive the decision. `resolved` means it was acted on, `dismissed` means
        no action was needed.
      tags:
        - Admin
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [resolved, dismissed] }
                note:   { type: string, nullable: true, maxLength: 500 }
              required: [action]
      responses:
        '200':
          description: The report was decided by this call
        '400':
          description: Missing or unknown action
        '401':
          description: Unauthorized
        '403':
          description: Not an admin
        '404':
          description: No such report
        '409':
          description: Already decided, by this admin or another one

  /api/admin/companies/pending:
    get:
      operationId: adminPendingCompanies
      summary: Companies created by a workplace rating and awaiting review (admin only)
      tags:
        - Admin
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Companies waiting to be let into the directory
        '403':
          description: Not an admin

  /api/admin/companies/{companyId}/decision:
    post:
      operationId: adminDecidePendingCompany
      summary: Let a pending company into the directory, or refuse it (admin only)
      tags:
        - Admin
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approve: { type: boolean }
              required: [approve]
      responses:
        '200':
          description: Decision recorded
        '404':
          description: No pending company with that id

  /api/admin/companies/{companyId}:
    put:
      operationId: adminRenameCompany
      summary: Rename a company, and optionally correct its brand, cascading to linked records (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: companyId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                # The admin's own choice of brand. Optional, and absent means "leave it alone":
                # a rename must not clear a logo as a side effect.
                #
                # logo.dev answers a correct domain with the OWNER's mark - knotts.com returns
                # Six Flags, because Cedar Fair merged into it - so no domain we resolve can fix
                # some logos. A person deciding is the only remaining authority, which is what
                # domain_source = 'ADMIN' already means in the companies table.
                domain:
                  type: string
                  nullable: true
                logoUrl:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Rename successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '409':
          description: Name already taken — use the merge tool

  /api/admin/companies/{keepId}/merge/{mergeId}/preview:
    get:
      operationId: previewCompanyMerge
      summary: What a merge would move, and whether it can run (admin only)
      description: >
        Read-only. Reports how much would move and flags anything that blocks the merge, so an
        admin is never running one blind. `blocked` is true when interview reviews would collide -
        the same person having reviewed interviewing at both companies in the same year - which has
        no correct automatic answer and must be resolved by a human first.
      tags:
        - Admin
      parameters:
        - in: path
          name: keepId
          required: true
          schema:
            type: integer
        - in: path
          name: mergeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Merge assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  keepName:           { type: string }
                  mergeName:          { type: string }
                  managers:           { type: integer, format: int64 }
                  careerEntries:      { type: integer, format: int64 }
                  interviews:         { type: integer, format: int64 }
                  aliases:            { type: integer, format: int64 }
                  pendingEdits:       { type: integer, format: int64 }
                  interviewConflicts: { type: integer, format: int64 }
                  duplicateManagers:  { type: integer, format: int64 }
                  blocked:            { type: boolean }
        '400':
          description: Invalid request or company not found
        '403':
          description: Forbidden

  /api/admin/company-merges/{mergeRecordId}/undo:
    post:
      operationId: undoCompanyMerge
      summary: Reverse a completed company merge (admin only)
      description: >
        Puts back exactly the rows the merge moved, using the manifest it recorded. Anything added
        to the surviving company after the merge stays there. A merge can be reverted once.
      tags:
        - Admin
      parameters:
        - in: path
          name: mergeRecordId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Merge reverted
        '400':
          description: Unknown merge, or one that has already been reverted
        '403':
          description: Forbidden

  /api/admin/companies/{childId}/parent:
    put:
      operationId: setCompanyParent
      summary: Record that one company is part of another (admin only)
      description: >
        Corporate structure, not a merge. Both companies keep their own page, managers, ratings and
        search presence; this only records that one belongs to the other. A company has one parent,
        so setting it again re-points an existing relationship rather than adding a second.


        Loops are rejected: a company cannot be made part of something already beneath it.
      tags:
        - Admin
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parentId
              properties:
                parentId:
                  type: integer
                  format: int64
                relationshipType:
                  type: string
                  enum: [SUBSIDIARY_OF, BRAND_OF, DIVISION_OF, OWNED_BY, FRANCHISE_OF, JOINT_VENTURE_OF]
                  description: Defaults to SUBSIDIARY_OF. Not shown to readers; the page says "Part of X".
      responses:
        '200':
          description: Relationship recorded
        '400':
          description: Invalid request, unknown relationship type, or would create a loop
        '403':
          description: Forbidden

    delete:
      operationId: removeCompanyParent
      summary: Detach a company from its parent (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: childId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Relationship removed
        '403':
          description: Forbidden

  /api/admin/companies/{keepId}/merge/{mergeId}:
