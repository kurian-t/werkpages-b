  /api/admin/moderation/held-ratings:
    get:
      operationId: adminModerationHeldRatings
      summary: Every held rating with why it is held and the action that would release it
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: managerId
          description: >
            Narrows the queue to one manager, which is what lets that manager's profile carry the
            same list inline. One query answers both, deliberately: `whyHeld` and
            `actionToRelease` are computed rather than stored, so two queries could disagree and a
            moderator would have no way to tell which was current.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Held ratings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/moderation/held-ratings/{reviewId}/publish:
    post:
      operationId: adminModerationPublishHeldRating
      summary: Publish one held rating, if the database says it may be
      description: >
        For the rating the queue reports as `wouldPublishNow`. Until this existed every release was
        a side effect of some other decision - accepting an employment, linking a claim, resolving
        a conflict - so a rating whose obstacle had been cleared outside its own scope stayed held
        while the queue said it was ready.

        `rating_role_is_publishable` is the only authority and is asked inside the transaction, so
        the answer cannot change in the gap between the check and the write. A rating something is
        still holding gets 409, not a database error at commit.
      tags:
        - Admin
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewId:
                    type: string
                    format: uuid
                  managerId:
                    type: integer
                    format: int64
                  published:
                    type: boolean
        '400':
          description: Invalid rating ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such rating
        '409':
          description: Something is still holding it, or it is no longer held

