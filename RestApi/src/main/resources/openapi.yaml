openapi: 3.0.3
info:
  title: Werkpages API
  version: 1.0.0
servers:
  - url: http://localhost:8888
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user session management
  - name: Managers
    description: Manager profiles, reviews, and edit requests
  - name: Admin
    description: Admin-only management operations
  - name: Users
    description: User-specific operations
  - name: Notifications
    description: In-app notifications
  - name: Stats
    description: Site-wide statistics
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: Create a new user account
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/check-username:
    get:
      operationId: checkUsername
      summary: Check if a username is available
      tags:
        - Auth
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
        '400':
          description: Missing or invalid username

  /api/auth/signin:
    post:
      operationId: signin
      summary: Authenticate a user and return JWT
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/signout:
    post:
      operationId: signout
      summary: Sign out user (invalidate session)
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me:
    get:
      operationId: me
      summary: Get current authenticated user info
      tags:
        - Auth
      responses:
        '200':
          description: Returns the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (missing/invalid JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me/delete:
    delete:
      operationId: deleteMe
      summary: Delete the authenticated user's account and anonymize their reviews
      tags:
        - Auth
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/callback:
    post:
      operationId: socialAuthCallback
      summary: Exchange an OAuth authorization code for a session (social login)
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code:
                  type: string
                redirectUri:
                  type: string
      responses:
        '200':
          description: Authentication successful — sets auth_token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
        '400':
          description: Missing code or no email from provider
        '401':
          description: Token exchange failed

  /api/users/me/reviews:
    get:
      operationId: getMyReviews
      summary: Get all reviews written by the authenticated user
      tags:
        - Users
      responses:
        '200':
          description: List of reviews with manager info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'

  /api/users/me/submitted-managers:
    get:
      operationId: getMySubmittedManagers
      summary: Get managers submitted by the authenticated user (pending/rejected)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of submitted managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/users/me/has-contributed:
    get:
      operationId: hasContributed
      summary: Check if the authenticated user has at least one approved review
      tags:
        - Users
      responses:
        '200':
          description: Contribution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasContributed:
                    type: boolean

  /api/stats:
    get:
      operationId: getStats
      summary: Get site-wide stats (total managers and reviews)
      tags:
        - Stats
      security: []
      responses:
        '200':
          description: Site-wide stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalManagers:
                    type: integer
                  totalReviews:
                    type: integer

  /api/companies/listing:
    get:
      operationId: getCompanyListing
      summary: Get company listing with stats (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of companies with manager count, review count, and avg rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        logoUrl:
                          type: string
                        managerCount:
                          type: integer
                        totalReviews:
                          type: integer
                        avgRating:
                          type: number

  # ── Interview experience reviews ────────────────────────────────────────────
  # Attached to a company, not a manager. Structured only: no free text, because an interview
  # review naming an interviewer is a defamation surface with no employment relationship behind it.

  /api/companies/{companySlug}/interviews:
    get:
      operationId: getCompanyInterviews
      summary: Interview experience stats for a company (public; category breakdown is gated)
      tags:
        - Interviews
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
        - in: query
          name: country
          description: >-
            Restricts the comparison chart to interviews for positions in this country. Same scope
            rule as role: the summary above the chart never moves.
          required: false
          schema:
            type: string
        - in: query
          name: role
          description: >-
            Restricts the comparison chart only. Every other figure in the response describes all
            interviews on record, so exploring the chart never moves the company's headline
            numbers. There is deliberately no outcome filter: the chart carries all three series
            at once, and filtering by outcome would hide what is being compared.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Interview stats for the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInterviewStats'
        '400':
          description: Invalid filter
        '404':
          description: Company not found

    post:
      operationId: createInterviewReview
      summary: Submit an interview experience review for a company
      tags:
        - Interviews
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReview'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Account suspended
        '404':
          description: Company not found
        '409':
          description: This user already reviewed this company for that year
        '429':
          description: Daily submission limit reached

  /api/interviews/{reviewId}:
    put:
      operationId: updateInterviewReview
      summary: Replace one of your own interview reviews
      description: >-
        Ownership is enforced in the UPDATE itself, so there is no window between checking and
        writing. Rounds are replaced wholesale rather than merged - an edit supplies the full list,
        and merging would strand rounds from the old process inside the new one.
      tags:
        - Interviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewReviewRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReview'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '404':
          description: Not found, or not yours
    delete:
      operationId: deleteInterviewReview
      summary: Soft-delete one of your own interview reviews
      tags:
        - Interviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid review id
        '401':
          description: Unauthorized
        '404':
          description: Review not found

  /api/users/me/has-interview-contributed:
    get:
      operationId: hasInterviewContributed
      summary: Whether the authenticated user has submitted an interview review
      tags:
        - Interviews
      responses:
        '200':
          description: Contribution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasContributed:
                    type: boolean
        '401':
          description: Unauthorized

  /api/industries/interview-averages:
    get:
      operationId: getIndustryInterviewAverages
      summary: Interview experience averages per industry (public)
      tags:
        - Interviews
      security: []
      responses:
        '200':
          description: Per-industry interview averages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        industry:
                          type: string
                        reviewCount:
                          type: integer
                        avgRating:
                          type: number
                          nullable: true
                        avgDifficulty:
                          type: number
                          nullable: true

  /api/industries/listing:
    get:
      operationId: getIndustryListing
      summary: Browse industries with aggregate stats (public)
      tags:
        - Industries
      security: []
      responses:
        '200':
          description: One entry per industry with company/manager/review counts and avg rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        industry:
                          type: string
                        slug:
                          type: string
                        companyCount:
                          type: integer
                        managerCount:
                          type: integer
                        totalReviews:
                          type: integer
                        avgRating:
                          type: number
                          nullable: true

  /api/industries/by-slug/{slug}:
    get:
      operationId: getIndustryProfile
      summary: Get an industry profile with stats and its companies (public)
      tags:
        - Industries
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Industry profile with stats and companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  industry:
                    type: string
                  slug:
                    type: string
                  companyCount:
                    type: integer
                  managerCount:
                    type: integer
                  totalReviews:
                    type: integer
                  avgRating:
                    type: number
                    nullable: true
                  categoryAverages:
                    type: object
                  companies:
                    type: array
                    items:
                      type: object
        '404':
          description: Industry not found

  /api/companies/by-name:
    get:
      operationId: getCompanyProfile
      summary: Get company profile with aggregated stats and manager list (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: company
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  logoUrl:
                    type: string
                  managerCount:
                    type: integer
                  totalReviews:
                    type: integer
                  avgRating:
                    type: number
                  categoryAverages:
                    type: object
                  managers:
                    type: array
                    items:
                      type: object
        '400':
          description: company parameter missing
        '404':
          description: Company not found

  /api/companies:
    post:
      operationId: createCompany
      summary: Create a company, or return the existing one that name resolves to
      description: >
        The single place a company is brought into existence from a name. Every other write path
        takes a company ID, so this is what a client calls when the user explicitly chooses to add
        a company the picker did not offer. Returns the ID the caller then uses.


        Idempotent by design: an existing company with the same normalised name is returned rather
        than duplicated, so a double submit cannot create two.
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: The company, existing or newly created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  created:
                    type: boolean
                    description: False when an existing company was returned.
        '400':
          description: Missing or invalid name
        '401':
          description: Unauthorized

    get:
      operationId: getCompanies
      summary: Get distinct company names (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of distinct company names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /api/companies/suggest:
    get:
      operationId: suggestCompanies
      summary: Suggest company names matching a query (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching company suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    # The company's identity. A client that selects a suggestion sends this back
                    # on write, so the display name is never re-resolved into an identity.
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    logoUrl:
                      type: string
                    industry:
                      type: string

  /api/geo:
    get:
      operationId: getGeo
      summary: Resolve the visitor's country/state/city from Cloudflare headers (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: Visitor geo (any field may be null off Cloudflare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    nullable: true
                  state:
                    type: string
                    nullable: true
                  city:
                    type: string
                    nullable: true

  /api/managers/similar:
    get:
      operationId: getSimilarManagers
      summary: Find similar managers for duplicate detection (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: company
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of similar managers
          content:
            application/json:
              schema:
                type: object

  /api/managers/find-or-create:
    post:
      operationId: findOrCreateManager
      summary: Search for a manager by structured fields; auto-creates one on first search if not found (auth required)
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - title
                - company
                - country
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Search results (may include a newly created manager)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  created:
                    type: boolean

  /api/managers/ghost:
    post:
      operationId: createGhostManager
      summary: Capture manager intent as a ghost record — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Existing manager found — no new record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean
        '201':
          description: New ghost manager created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean

  /api/managers/anonymous-capture:
    post:
      operationId: captureAnonymousSearch
      summary: Silently create a pending_approval manager from an anonymous search — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Only the name is required here. This endpoint captures a search somebody made and
              # did not complete, so requiring every field rejected exactly the searches worth
              # keeping: a name plus a company, or a name plus a job title. The service then
              # requires the name and at least one of company or title - the line between "an
              # admin can act on this" and "two strangers happen to share a name".
              required:
                - name
              properties:
                name:
                  type: string
                company:
                  type: string
                  nullable: true
                title:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Accepted — pending manager queued for admin review (nothing returned to caller)
        '400':
          description: Validation error

  /api/managers/drop-off:
    post:
      operationId: createDropOffDraft
      summary: Capture full drop-off form data (manager + review) without authentication
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
                - review
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID linking this drop-off draft to a future authenticated submit for deduplication
                review:
                  type: object
                  required:
                    - author
                    - overallRating
                    - ratings
                    - workedFrom
                    - managerCompany
                    - managerTitle
                  properties:
                    author:
                      type: string
                    overallRating:
                      type: number
                    ratings:
                      type: object
                    workedFrom:
                      type: string
                    workedUntil:
                      type: string
                    managerCompany:
                      type: string
                    managerTitle:
                      type: string
      responses:
        '200':
          description: Manager already existed — review attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean
        '201':
          description: New pending manager created with review
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean

  /api/managers:
    get:
      operationId: getManagers
      summary: List managers (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: search
          schema:
            type: string
          description: Optional. Case-insensitive search across name, company, and title.
        - in: query
          name: company
          schema:
            type: string
          description: Optional. Filter by exact company name (case-insensitive).
      responses:
        '200':
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer

    post:
      operationId: createManager
      summary: Create a new manager
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - image
                - status
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                  nullable: true
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID from drop-off draft; matching anonymous review is deleted before inserting the authenticated one
      responses:
        '201':
          description: Manager created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'

