  /api/roles/suggest:
    get:
      operationId: suggestRoles
      summary: Title suggestions for the add-manager form (public)
      description: >-
        Offers the spellings other people already used, which is what stops new variants being
        created. Draws on manager titles and interview roles together, since they are the same
        vocabulary. The query is normalized before matching, so "sr" finds "Senior Manager"; what
        comes back is the most common real spelling in each normalized group.
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching titles, prefix matches and common spellings first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      description: The most common real spelling, which is what a person expects to pick.
                      type: string
                    normalized:
                      type: string
                    usageCount:
                      description: >-
                        How many managers and interview reviews use this spelling. Drives the
                        ordering so the most common form is first; not shown in the UI.
                      type: integer

  # ── Role normalization ──────────────────────────────────────────────────────
  # Titles are free text, so the same job arrives as "Senior Manager", "Sr. Manager" and "sr mgr".
  # The database normalizes the string on write (V49); these endpoints assign meaning to the
  # result and let an admin review and correct it.

  /api/admin/roles:
    get:
      operationId: listRoleAliases
      summary: Distinct normalized titles and what they were classified as, most common first
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Alias table plus corpus coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAliasListing'
        '401':
          description: Unauthorized
        '403':
          description: Not an admin

    put:
      operationId: setRoleAlias
      summary: Correct one title mapping by hand
      description: >-
        Marks the row as manually classified, which puts it out of reach of every automated pass.
        A human correction is the best signal available and must not be undone by the next sweep.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titleNormalized]
              properties:
                titleNormalized:
                  type: string
                roleFamily:
                  type: string
                  nullable: true
                  enum: [engineering, product, design, data, it, sales, marketing,
                         customer_support, operations, finance, hr, legal,
                         project_management, research, education, healthcare, general, other]
                seniority:
                  type: string
                  nullable: true
                  enum: [lead, manager, senior_manager, director, vp, executive]
      responses:
