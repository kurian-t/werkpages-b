  /api/admin/slug-reclaim-candidates:
    get:
      operationId: listSlugReclaimCandidates
      summary: Live managers whose plain name slug has become free (admin only)
      description: >
        A slug is chosen at INSERT against whatever held the name then - often a row no visitor
