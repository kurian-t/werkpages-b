openapi: 3.0.3
info:
  title: RateMyManager API
  version: 1.0.0
servers:
  - url: http://localhost:8888
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user session management
  - name: Managers
    description: Manager profiles, reviews, and edit requests
  - name: Admin
    description: Admin-only management operations
  - name: Users
    description: User-specific operations
  - name: Notifications
    description: In-app notifications
  - name: Stats
    description: Site-wide statistics
paths:
  /api/auth/signup:
    post:
      operationId: signup
      summary: Create a new user account
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/signin:
    post:
      operationId: signin
      summary: Authenticate a user and return JWT
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigninResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/signout:
    post:
      operationId: signout
      summary: Sign out user (invalidate session)
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me:
    get:
      operationId: me
      summary: Get current authenticated user info
      tags:
        - Auth
      responses:
        '200':
          description: Returns the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (missing/invalid JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me/delete:
    delete:
      operationId: deleteMe
      summary: Delete the authenticated user's account and anonymize their reviews
      tags:
        - Auth
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/users/me/reviews:
    get:
      operationId: getMyReviews
      summary: Get all reviews written by the authenticated user
      tags:
        - Users
      responses:
        '200':
          description: List of reviews with manager info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'

  /api/users/me/submitted-managers:
    get:
      operationId: getMySubmittedManagers
      summary: Get managers submitted by the authenticated user (pending/rejected)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of submitted managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/stats:
    get:
      operationId: getStats
      summary: Get site-wide stats (total managers and reviews)
      tags:
        - Stats
      security: []
      responses:
        '200':
          description: Site-wide stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalManagers:
                    type: integer
                  totalReviews:
                    type: integer

  /api/companies:
    get:
      operationId: getCompanies
      summary: Get distinct company names (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of distinct company names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /api/managers/similar:
    get:
      operationId: getSimilarManagers
      summary: Find similar managers for duplicate detection (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: company
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of similar managers
          content:
            application/json:
              schema:
                type: object

  /api/managers:
    get:
      operationId: getManagers
      summary: List managers (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: search
          schema:
            type: string
          description: Optional. Case-insensitive search across name, company, and title.
        - in: query
          name: company
          schema:
            type: string
          description: Optional. Filter by exact company name (case-insensitive).
      responses:
        '200':
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer

    post:
      operationId: createManager
      summary: Create a new manager
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - image
                - status
              properties:
                name:
                  type: string
                company:
                  type: string
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                linkedinUrl:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Manager created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'

  /api/managers/{id}:
    get:
      operationId: getManagerById
      summary: Get a single manager profile (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '404':
          description: Manager not found

    put:
      operationId: updateManager
      summary: Update any writeable manager fields and optionally track career history
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                company:
                  type: string
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                linkedinUrl:
                  type: string
                  nullable: true
                overallRating:
                  type: number
                  minimum: 0
                  maximum: 5
                reviews:
                  type: integer
                  minimum: 0
                categoryAverages:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        '200':
          description: Manager updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '400':
          description: Nothing to update
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found

  /api/managers/{id}/recalculate:
    put:
      operationId: recalculateManagerStats
      summary: Recalculate and persist a manager's overall_rating, reviews_count, and category_averages
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: The manager ID to recalculate stats for
      responses:
        '200':
          description: Manager stats recalculated and updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/reviews:
    get:
      operationId: getManagerReviews
      summary: Get all reviews for a manager (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [recent, helpful, highest, lowest]
            default: recent
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
          description: Optional. When provided, returns only reviews written by this user.
      responses:
        '200':
          description: Paginated list of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: Invalid userId format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    post:
      operationId: createManagerReview
      summary: Submit a new review for a manager
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerReviewInput'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerReview'
        '404':
          description: Manager not found

  /api/managers/{id}/report:
    post:
      operationId: reportManager
      summary: Report an inaccurate or incorrect manager profile
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum: [incorrect_person, never_worked_here, duplicate_profile, incorrect_information, other]
                comment:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Report submitted successfully
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/edit-requests:
    post:
      operationId: createManagerEditRequest
      summary: Submit a pending edit request for a manager's company/title
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: Edit request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          description: Validation error
        '404':
          description: Manager not found

  /api/managers/{id}/pending-edits:
    get:
      operationId: getManagerPendingEdits
      summary: Get pending edit requests for a manager (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of pending edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/admin/pending-edits:
    get:
      operationId: getAdminPendingEdits
      summary: Get all pending manager edit requests (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: List of pending edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '403':
          description: Forbidden

  /api/admin/pending-edits/{editId}/approve:
    post:
      operationId: approveManagerEdit
      summary: Approve a pending manager edit (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: editId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Edit approved and applied
        '403':
          description: Forbidden
        '404':
          description: Edit not found

  /api/admin/pending-edits/{editId}/reject:
    post:
      operationId: rejectManagerEdit
      summary: Reject a pending manager edit (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: editId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Edit rejected
        '403':
          description: Forbidden
        '404':
          description: Edit not found

  /api/admin/users:
    get:
      operationId: getAdminUsers
      summary: Get all non-admin users with ban status (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '403':
          description: Forbidden

  /api/admin/banned-users:
    get:
      operationId: getAdminBannedUsers
      summary: Get all banned users (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: List of banned users
        '403':
          description: Forbidden

  /api/admin/users/{userId}/ban:
    post:
      operationId: banUser
      summary: Ban a user (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: User banned
        '403':
          description: Forbidden
        '404':
          description: User not found
    delete:
      operationId: unbanUser
      summary: Remove a user ban (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unbanned
        '403':
          description: Forbidden
        '404':
          description: Ban not found

  /api/admin/pending-managers:
    get:
      operationId: getAdminPendingManagers
      summary: Get all managers pending approval (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: List of pending managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '403':
          description: Forbidden

  /api/admin/pending-managers/{managerId}/approve:
    post:
      operationId: approvePendingManager
      summary: Approve a pending manager (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Manager approved
        '403':
          description: Forbidden
        '404':
          description: Pending manager not found

  /api/admin/pending-managers/{managerId}/reject:
    post:
      operationId: rejectPendingManager
      summary: Reject a pending manager (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Manager rejected
        '403':
          description: Forbidden
        '404':
          description: Pending manager not found

  /api/admin/managers/{keepId}/merge/{mergeId}:
    post:
      operationId: mergeManagers
      summary: Merge a duplicate manager into another (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: keepId
          required: true
          schema:
            type: integer
        - in: path
          name: mergeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Merge successful
        '400':
          description: Invalid request
        '403':
          description: Forbidden
        '404':
          description: Manager not found

  /api/notifications:
    get:
      operationId: getNotifications
      summary: Get notifications for the authenticated user
      tags:
        - Notifications
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /api/notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      summary: Get count of unread notifications
      tags:
        - Notifications
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
        '401':
          description: Unauthorized

  /api/notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      summary: Mark all notifications as read
      tags:
        - Notifications
      responses:
        '200':
          description: All notifications marked as read
        '401':
          description: Unauthorized

  /api/notifications/{id}/read:
    put:
      operationId: markNotificationRead
      summary: Mark a single notification as read
      tags:
        - Notifications
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification marked as read
        '401':
          description: Unauthorized

  /api/managers/{managerId}/reviews/{reviewId}:
    put:
      operationId: updateManagerReview
      summary: Update an existing review
      tags:
        - Managers
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerReviewUpdate'
      responses:
        '200':
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerReviewUpdated'
        '404':
          description: Review not found

    delete:
      operationId: deleteManagerReview
      summary: Delete a review
      tags:
        - Managers
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review deleted
        '401':
          description: Unauthorized
        '404':
          description: Review not found

components:
  schemas:
    ManagerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer

    ManagerDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        bio:
          type: string
        status:
          type: string
          enum: [active, retired]
        categoryAverages:
          type: object
          additionalProperties:
            type: number
        linkedinUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        careerHistory:
          type: array
          items:
            type: object
            properties:
              company:
                type: string
              title:
                type: string
              startDate:
                type: string
                format: date-time
              endDate:
                type: string
                format: date-time
                nullable: true

    ManagerReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        managerId:
          type: integer
        author:
          type: string
        overallRating:
          type: number
          minimum: 0
          maximum: 5
        ratings:
          type: object
          properties:
            communication_style:
              type: number
            perceived_approachability:
              type: number
            perceived_clarity_of_expectations:
              type: number
            feedback_style:
              type: number
            perceived_supportiveness:
              type: number
            decision_making_style:
              type: number
            organization_and_planning_style:
              type: number
            delegation_style:
              type: number
            perceived_professional_demeanor:
              type: number
            overall_working_experience:
              type: number
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true
        verified:
          type: boolean
        helpfulCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    ManagerReviewInput:
      type: object
      required:
        - author
        - ratings
        - managerCompany
        - managerTitle
      properties:
        author:
          type: string
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true

    ManagerReviewUpdate:
      type: object
      required:
        - overallRating
        - ratings
        - managerCompany
        - managerTitle
      properties:
        overallRating:
          type: number
        ratings:
          $ref: '#/components/schemas/ManagerReview/properties/ratings'
        managerCompany:
          type: string
        managerTitle:
          type: string
        text:
          type: string
          nullable: true

    User:
      type: object
      required:
