openapi: 3.0.3
info:
  title: Werkpages API
  version: 1.0.0
servers:
  - url: http://localhost:8888
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Authentication and user session management
  - name: Managers
    description: Manager profiles, reviews, and edit requests
  - name: Admin
    description: Admin-only management operations
  - name: Users
    description: User-specific operations
  - name: Notifications
    description: In-app notifications
  - name: Stats
    description: Site-wide statistics
paths:
  /api/auth/check-username:
    get:
      operationId: checkUsername
      summary: Check if a username is available
      tags:
        - Auth
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
        '400':
          description: Missing or invalid username

  /api/auth/signout:
    post:
      operationId: signout
      summary: Sign out user (invalidate session)
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/complete-profile:
    post:
      operationId: completeProfile
      summary: Choose a username, completing a newly created profile
      description: >
        An account created through Universal Login has a generated placeholder username and
        `username_is_provisional` set, because Universal Login asks for an email and a password
        and never for a username. This claims a real one and clears the flag. It refuses once the
        profile is complete: changing an established username is a different feature with
        different consequences, and this endpoint must not become a back door to it.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                firstName:
                  type: string
                  maxLength: 100
                  description: >
                    Optional. Omitted or blank leaves whatever is stored alone, which matters for
                    an account created through a social provider that already filled it in.
                lastName:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Username claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  { type: boolean }
                  username: { type: string }
        '400':
          description: The username is not valid
        '401':
          description: Unauthorized
        '409':
          description: >
            Either the username is taken, or this profile was already complete. The two are
            reported distinctly so the page can say which.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [username_taken, profile_already_complete] }

  /api/auth/recover:
    post:
      operationId: recoverAccount
      summary: Ask for a reminder of which email address an account uses
      description: >
        Takes a username and, when it matches an account, sends a message to THAT ACCOUNT'S OWN
        email address naming the address it uses. The response is identical whether or not an
        account matched: it carries no field that could differ, and it does not wait for the mail
        to be sent, so neither the body nor the timing distinguishes the two cases. This is
        deliberate - resolving a username to an email in a response, a redirect or an Auth0
        login_hint would be an account enumeration oracle.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '202':
          description: >
            Accepted. Always returned, for any syntactically valid username, whether or not an
            account exists and whether or not a message was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/sessions:
    get:
      operationId: listMySessions
      summary: The sessions this account currently has open
      tags:
        - Auth
      responses:
        '200':
          description: Live sessions, most recently used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        product:    { type: string }
                        createdAt:  { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
                        expiresAt:  { type: string, format: date-time }
                        userAgent:  { type: string, nullable: true }
                        current:    { type: boolean }
        '401':
          description: Unauthorized

  /api/auth/sessions/revoke-all:
    post:
      operationId: revokeMySessions
      summary: Sign out of every session on this account, on every device
      tags:
        - Auth
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:          { type: boolean }
                  sessionsRevoked:  { type: integer }
        '401':
          description: Unauthorized

  /api/admin/users/{userId}/sessions:
    delete:
      operationId: adminRevokeUserSessions
      summary: End every session an account holds, without banning it (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:          { type: boolean }
                  sessionsRevoked:  { type: integer }
        '403':
          description: Forbidden
        '404':
          description: User not found

  /api/auth/me:
    get:
      operationId: me
      summary: Get current authenticated user info
      tags:
        - Auth
      responses:
        '200':
          description: Returns the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized (missing/invalid JWT)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/me/delete:
    delete:
      operationId: deleteMe
      summary: Delete the authenticated user's account and anonymize their reviews
      tags:
        - Auth
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/auth/start:
    get:
      operationId: socialAuthStart
      summary: Begin a social login; mints state and a PKCE verifier and redirects to Auth0
      description: >
        The server mints `state` and a PKCE `code_verifier`, stores both in an HttpOnly
        `auth_preauth` cookie, and redirects to Auth0 carrying only the S256 `code_challenge`.
        The browser never sees the verifier, which is what binds the authorization code to the
        browser that began the login. `redirect_uri` is built server-side and is never taken
        from the caller.
      security: []
      tags:
        - Auth
      parameters:
        - in: query
          name: connection
          required: true
          schema:
            type: string
          description: The Auth0 connection, checked against a fixed allowlist.
        - in: query
          name: screen_hint
          required: false
          schema:
            type: string
            enum: [signup]
          description: >
            Opens Universal Login's registration panel instead of its sign-in panel. The ONLY
            accepted value is `signup`; anything else is ignored rather than reflected, because
            this value is interpolated into the authorize URL the browser is redirected to and a
            passthrough there would be a parameter-injection vector.
        - in: query
          name: returnTo
          required: false
          schema:
            type: string
          description: >
            Where to send the user after sign-in. Accepted only as a site-relative path;
            anything else falls back to the product default.
      responses:
        '302':
          description: Redirect to Auth0, setting the auth_preauth cookie
        '400':
          description: Unsupported connection

  /api/auth/callback:
    post:
      operationId: socialAuthCallback
      summary: Exchange an OAuth authorization code for a session (social login)
      description: >
        Completes a login begun at `/api/auth/start`. Requires the `__Host-auth_tx` cookie set
        there, and a `state` the server issued. Both are checked against one server-side row in
        a single atomic delete, so a callback is single-use and is bound to the browser that
        began it; the stored PKCE `code_verifier` never reaches any browser and is sent to Auth0
        with the exchange. Every binding failure - absent cookie, duplicate cookie name, unknown
        state, wrong browser, already used, expired - is refused identically with 400
        `invalid_login_transaction`, and the exchange is not attempted. `redirectUri` in the body
        is IGNORED: the value presented to Auth0 is derived server side from the canonical app
        origin, because a client-supplied one is an invitation to have codes delivered elsewhere.
        The cookie is deliberately NOT cleared on a refusal, which would strand this browser's
        other tabs mid-login.
      security: []
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code:
                  type: string
                redirectUri:
                  type: string
                  description: >
                    IGNORED. Kept in the schema because the frontend still sends it and the field
                    is required. The exchange presents a redirect_uri derived server side.
                state:
                  type: string
                  description: >
                    Echoed by Auth0, and the key of the server-side login transaction. A callback
                    without it is always refused; there is no longer any flag or rollout window in
                    which it is optional. It stays optional in THIS SCHEMA on purpose, so that the
                    refusal is the handler's audited one - 400 `invalid_login_transaction`, the
                    message the callback page renders - rather than a contract-validation 400 the
                    frontend does not recognise.
      responses:
        '200':
          description: Authentication successful — sets auth_token cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
        '400':
          description: Missing code or no email from provider
        '401':
          description: Token exchange failed

  /api/users/me/reviews:
    get:
      operationId: getMyReviews
      summary: Get all reviews written by the authenticated user
      tags:
        - Users
      responses:
        '200':
          description: List of reviews with manager info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerReview'

  /api/users/me/submitted-managers:
    get:
      operationId: getMySubmittedManagers
      summary: Get managers submitted by the authenticated user (pending/rejected)
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of submitted managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/users/me/has-contributed:
    get:
      operationId: hasContributed
      summary: Check if the authenticated user has at least one approved review
      tags:
        - Users
      responses:
        '200':
          description: Contribution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasContributed:
                    type: boolean

  # The contributor's own unfinished ratings (V110).
  #
  # Private to the account that wrote them: never read by moderation, never aggregated. Addressed
  # under /users/me so there is no object id whose owner could be checked wrongly, and no route
  # accepts an owner or a draft token. application/json only, which is also what makes a cross-site
  # HTML form unable to reach any of this.
  /api/users/me/drafts:
    get:
      operationId: listMyDrafts
      summary: The authenticated contributor's unfinished ratings, newest first
      tags:
        - Users
      responses:
        '200':
          description: The caller's own drafts, with what can still be done with each
          content:
            application/json:
              schema:
                type: object
                properties:
                  drafts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContributionDraft'
                  retentionDays:
                    type: integer
    put:
      operationId: saveMyDraft
      summary: Save the authenticated contributor's unfinished rating
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectType, subjectId, payload, writeId]
              properties:
                subjectType:
                  type: string
                  enum: [manager, company, interview]
                subjectId:
                  type: integer
                  format: int64
                ordinal:
                  type: integer
                  description: Which of the person's two rating slots. Defaults to 1.
                payload:
                  type: object
                  description: The form, verbatim.
                baseVersion:
                  type: integer
                  format: int64
                  description: The version the client last saw. Omitted on the first write.
                writeId:
                  type: string
                  description: >-
                    Identifies ONE immutable write, reused across every retry of that same
                    payload. Answers that changed are a different write and need a different id,
                    or a delayed response would acknowledge answers it never carried.
                captureToken:
                  type: string
                  description: >-
                    The anonymous capture this draft continues, on creation only. A write
                    resolution key; it authorizes nothing.
      responses:
        '200':
          description: Accepted, or a recognised replay answered from the stored version
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: integer
                    format: int64
                  replayed:
                    type: boolean
                  retentionDays:
                    type: integer
        '409':
          description: Another device is ahead. Nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: integer
                    format: int64
                  conflict:
                    type: boolean
                  payload:
                    type: object

  /api/users/me/drafts/{draftId}:
    get:
      operationId: getMyDraft
      summary: One of the authenticated contributor's own unfinished ratings
      tags:
        - Users
      parameters:
        - in: path
          name: draftId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionDraft'
        '404':
          description: >-
            No such draft of the caller's own. A draft belonging to somebody else answers
            identically, so a stranger cannot learn which ids exist.
    delete:
      operationId: discardMyDraft
      summary: Discard one of the authenticated contributor's own unfinished ratings
      tags:
        - Users
      parameters:
        - in: path
          name: draftId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  discarded:
                    type: boolean
        '404':
          description: No such draft of the caller's own

  /api/stats:
    get:
      operationId: getStats
      summary: Get site-wide stats (total managers and reviews)
      tags:
        - Stats
      security: []
      responses:
        '200':
          description: Site-wide stats
          content:
            application/json:
              schema:
                type: object
                description: >-
                  The dashboard counters. This block previously documented totalManagers and
                  totalReviews, which the endpoint has not returned for a long time - corrected
                  here rather than left to mislead the next reader.
                properties:
                  realManagers:
                    type: integer
                    description: Visible managers submitted by people, excluding seeded and scraped rows.
                  realReviews:
                    type: integer
                    description: Opinions on visible managers, excluding weighted placeholders.
                  weightedOpinions:
                    type: integer
                    description: Unexpired weighted placeholder reviews.
                  seededManagers:
                    type: integer
                    description: >-
                      Seeded placeholder profiles still live. No longer shown on the dashboard,
                      but still returned - removing a field is a breaking change for any other reader.
                  scrapedManagers:
                    type: integer
                    description: Visible managers that arrived from a scrape rather than a person.
                  companyReviews:
                    type: integer
                    description: >-
                      Live workplace ratings (company_reviews, excluding withdrawn). Shown on the
                      admin dashboard in place of the seeded-profile countdown.

  /api/companies/listing:
    get:
      operationId: getCompanyListing
      summary: Get company listing with stats (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of companies with manager count, review count, and avg rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        logoUrl:
                          type: string
                        managerCount:
                          type: integer
                        totalReviews:
                          type: integer
                        avgRating:
                          type: number

  # ── Interview experience reviews ────────────────────────────────────────────
  # Attached to a company, not a manager. Structured only: no free text, because an interview
  # review naming an interviewer is a defamation surface with no employment relationship behind it.

  /api/companies/{companySlug}/interviews/draft:
    post:
      operationId: captureInterviewDraft
      summary: Keep an interview experience somebody assembled but could not submit
      description: >-
        The form renders for everybody; the account is asked for at submit. Somebody who is not
        signed in has answered every question by then, and most do not come back from the sign-in
        page - this keeps what they had for an admin to read. Never published, never aggregated.
        Unauthenticated by design.
      tags:
        - Interviews
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Whatever the form held. Stored verbatim; no key is required.
              properties:
                draftToken:
                  type: string
                  format: uuid
                  description: >-
                    Carried into the real submission so the draft is deleted when the form is
                    finished, rather than leaving an admin to review completed work.
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured: { type: boolean }
        '400':
          description: Nothing to capture

  /api/companies/{companySlug}/interviews/autosave:
    post:
      operationId: autosaveInterview
      summary: Keep an interview experience somebody assembled but could not submit
      description: >-
        The form renders for everybody; the account is asked for at submit. Somebody who is not
        signed in has answered every question by then, and most do not come back from the sign-in
        page - this keeps what they had for an admin to read. Never published, never aggregated.
        Unauthenticated by design.
      tags:
        - Interviews
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Whatever the form held. Stored verbatim; no key is required.
              properties:
                draftToken:
                  type: string
                  format: uuid
                  description: >-
                    Carried into the real submission so the draft is deleted when the form is
                    finished, rather than leaving an admin to review completed work.
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured: { type: boolean }
        '400':
          description: Nothing to capture

  /api/companies/{companySlug}/interviews/list:
    get:
      operationId: listCompanyInterviews
      summary: The individual interview experiences behind the averages
      description: >-
        Gated exactly as the category data is - sharing an experience is what buys the detail.
        A reader who has not contributed gets {"data": [], "gated": true}.
      tags:
        - Interviews
      # Signed out is a valid state: it resolves to no contributor, and the gated empty list is
      # the right answer rather than a 401. Same as getCompanyInterviews beside it.
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Interview experiences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:   { type: array, items: { type: object } }
                  gated:  { type: boolean }
                  limit:  { type: integer }
                  offset: { type: integer }
        '404':
          description: Company not found

  /api/companies/{companySlug}/interviews:
    get:
      operationId: getCompanyInterviews
      summary: Interview experience stats for a company (public; category breakdown is gated)
      tags:
        - Interviews
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
        - in: query
          name: country
          description: >-
            Restricts the comparison chart to interviews for positions in this country. Same scope
            rule as role: the summary above the chart never moves.
          required: false
          schema:
            type: string
        - in: query
          name: role
          description: >-
            Restricts the comparison chart only. Every other figure in the response describes all
            interviews on record, so exploring the chart never moves the company's headline
            numbers. There is deliberately no outcome filter: the chart carries all three series
            at once, and filtering by outcome would hide what is being compared.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Interview stats for the company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInterviewStats'
        '400':
          description: Invalid filter
        '404':
          description: Company not found

    post:
      operationId: createInterviewReview
      summary: Submit an interview experience review for a company
      tags:
        - Interviews
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReview'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Account suspended
        '404':
          description: Company not found
        '409':
          description: This user already reviewed this company for that year
        '429':
          description: Daily submission limit reached

  /api/managers/{managerId}/proof-challenge:
    get:
      operationId: getMyProofChallenge
      summary: The proof challenge standing against your rating of this manager
      description: >-
        Returns {"challenge": null} when nothing is being asked of you, which is the normal case
        and not an error - the proof screen asks this on every visit.


        A challenge means the rating was saved and is being withheld until we know its author
        actually worked there. It is never lost, and contributing stays open even while reading is
        gated.
      tags:
        - ProofChallenges
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The live challenge, or null
        '401':
          description: Unauthorized

  /api/proof-challenges/{challengeId}/evidence:
    post:
      operationId: submitProofEvidence
      summary: Tell us how you worked with them
      description: >-
        The path for somebody who cannot verify a work email - most people who genuinely reported
        to a well-known figure have long since left. Never publishes: a person reads it, whatever
        the dates say. The claim is shown to admins to judge the rating and is never displayed on
        the site.
      tags:
        - ProofChallenges
      parameters:
        - in: path
          name: challengeId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workedFrom, claimedTitle, relationship]
              properties:
                workedFrom:
                  type: string
                  description: Month precision, "2019-03" - nobody remembers the day.
                workedUntil:
                  type: string
                  nullable: true
                claimedTitle:
                  type: string
                claimedOrg:
                  type: string
                  nullable: true
                relationship:
                  type: string
                  enum: [direct_report, skip_level, other_team]
                evidenceNote:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Submitted for review
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '404':
          description: No open challenge

  /api/admin/proof-challenges:
    get:
      operationId: adminGetProofChallenges
      summary: Ratings held pending proof
      description: >-
        Covers challenges nobody has answered as well as submitted evidence. Without the former, a
        challenge somebody walked away from would flag its author indefinitely while never
        appearing in front of anyone who could lift it.
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: The queue
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/proof-challenges/{challengeId}/resolve:
    post:
      operationId: adminResolveProofChallenge
      summary: Decide one held rating
      description: >-
        Separate from approving a manager, and deliberately so. "Is this a real person who belongs
        in the directory?" and "did this author work with them?" are different questions decided on
        different evidence, and often only one of them exists.
      tags:
        - Admin
      parameters:
        - in: path
          name: challengeId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve:
                  type: boolean
                reason:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Decided
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Challenge not found

  /api/admin/ghost-creation-status:
    get:
      operationId: adminGhostCreationStatus
      summary: Whether automatic manager creation is currently paused
      description: >-
        Anonymous searches auto-create publicly visible managers. Two rolling ceilings cap that
        site-wide, and when either holds the searches fall back to the pending queue with no error
        shown to anybody - so this endpoint is the only place a pause is visible. The counts also
        reveal the real baseline, which the ceilings were sized against total volume rather than
        measured against.
      tags:
        - Admin
      responses:
        '200':
          description: Current rates and ceilings
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastHour:   { type: integer }
                  lastDay:    { type: integer }
                  maxPerHour: { type: integer }
                  maxPerDay:  { type: integer }
                  paused:     { type: boolean }
                  trippedBy:  { type: string, nullable: true, enum: [hourly, daily] }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/job-titles/unlisted:
    get:
      operationId: adminListUnlistedTitles
      summary: Job titles in use that the catalogue does not hold
      description: >-
        The picker offers "Not listed? Add <what you typed>" for a title it cannot find, and that
        row keeps the wording and records nothing: the title reaches the site by being submitted,
        and job_titles could previously only change by writing a migration. This is the list that
        makes promoting one possible. Grouped by normalised key, because "Sr. Manager" and "Snr
        Manager" are one decision, and reported with counts, because a spelling fifty people use
        is a different proposition from one somebody typed once.
      tags:
        - Admin
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The titles, commonest first
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/admin/job-titles/promote:
    post:
      operationId: adminPromoteTitle
      summary: Add a title to the curated catalogue
      description: >-
        Writes the row with source = 'promoted', the value V116 reserved and nothing has ever
        written. Deliberately separate from approving the manager: a submission can be good while
        its title is a one-off nobody should be offered, and a title can be worth keeping from a
        submission rejected for something else. Answers added=false rather than failing when the
        catalogue already holds it, including when a different spelling normalises to the same key.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Added, or already present
        '400':
          description: Missing or unusable title
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/admin/high-profile-figures:
    get:
      operationId: adminListHighProfileFigures
      summary: The figures whose raters are asked for proof
      description: >-
        Identity, never a bare name: an entry is either a specific manager row, or a name AND a
        company. Matching on the name alone would challenge every unrelated person who happens to
        share it.
      tags:
        - Admin
      responses:
        '200':
          description: The list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      operationId: adminAddHighProfileFigure
      summary: Add a figure
      description: >-
        In a table rather than a constant because an anti-abuse list churns - the point is adding
        whoever is being typed this week without waiting on a deploy.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                managerId:
                  type: integer
                  format: int64
                  nullable: true
                fullName:
                  type: string
                  nullable: true
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Added
        '400':
          description: A name with no company identifies nobody
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/high-profile-figures/{figureId}:
    delete:
      operationId: adminRemoveHighProfileFigure
      summary: Remove a figure
      tags:
        - Admin
      parameters:
        - in: path
          name: figureId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Figure not found

  /api/companies/{companySlug}/ratings:
    get:
      operationId: listCompanyRatings
      summary: The individual ratings behind a company's average
      description: >-
        An average alone asks to be taken on trust. These are the ratings it is made of, so a
        reader can see the spread - whether a 4.2 is everybody saying 4.2, or half saying 5 and
        half saying 3.


        Anonymous, with one exception: the caller's own rating carries "mine": true so the page
        can show it back to them. That is derived from the token, never from a request parameter.
      tags:
        - CompanyRatings
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: The ratings
        '404':
          description: Company not found

  /api/companies/{companySlug}/rating/draft:
    post:
      operationId: captureCompanyRatingDraft
      summary: Keep a workplace rating somebody assembled but could not submit
      description: >-
        The rating form lets an unauthenticated person answer every question and then sends them to
        sign in. Many do not come back. This keeps what they had for an admin to read; it is never
        published and never aggregated. Unauthenticated by design - the whole point is the person
        who has no account yet.
      tags:
        - Companies
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Whatever the form held. Stored verbatim; no key is required.
              properties:
                datesHidden:
                  type: boolean
                  default: false
                  description: >-
                    Declared explicitly even though this body is stored verbatim: the
                    router drops properties a schema does not name, so an undeclared
                    field reaches the handler as absent however the box was ticked. That
                    exact trap already cost the manager form a release.
                draftToken:
                  type: string
                  format: uuid
                  description: >-
                    Carried into the real submission so the draft is deleted when the form is
                    finished, rather than leaving an admin to review completed work.
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured: { type: boolean }
        '400':
          description: Nothing to capture

  /api/companies/{companySlug}/rating/autosave:
    post:
      operationId: autosaveCompanyRating
      summary: Save the answers a rating form holds while it is still being filled in
      description: >-
        Called on a debounce while somebody is completing the form, so partial answers survive a
        closed tab. Idempotent on draftToken: one form session is one row however many times this
        is called, and an autosave carrying an older revision is ignored. Never published and
        never counted in a public average. Unauthenticated by design.
      tags:
        - Companies
      security: []
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Whatever the form held. Stored verbatim; no key is required.
              properties:
                datesHidden:
                  type: boolean
                  default: false
                  description: >-
                    Declared explicitly even though this body is stored verbatim: the
                    router drops properties a schema does not name, so an undeclared
                    field reaches the handler as absent however the box was ticked. That
                    exact trap already cost the manager form a release.
                draftToken:
                  type: string
                  format: uuid
                  description: >-
                    Carried into the real submission so the draft is deleted when the form is
                    finished, rather than leaving an admin to review completed work.
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured: { type: boolean }
        '400':
          description: Nothing to capture

  /api/companies/{companySlug}/rating:
    post:
      operationId: submitCompanyRating
      summary: Rate a company as a workplace
      description: >-
        What the employer is like to work for, as distinct from what its managers are like. All ten
        categories are required, and so is the author's own overall.


        THE RATING ITSELF IS THE AVERAGE OF ALL ELEVEN SCORES, computed by the database, the same
        way a manager rating averages its ten (one of which is "overall working experience"). The
        overall answer below is kept as data and counted as one of the eleven; it is not the
        company's rating on its own, which is what made a card read 1.0 over a breakdown of five
        5s, four 1s and a 3.


        One rating per person per company. Submitting again replaces the previous answer rather
        than being refused - somebody revisiting the form means to change their mind.


        Not gated on having rated a manager first: anyone can rate any manager, so such a gate
        buys friction rather than proof.
      tags:
        - CompanyRatings
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRatingRequest'
      responses:
        '200':
          description: Rating recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRating'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Account suspended
        '404':
          description: Company not found
    get:
      operationId: getMyCompanyRating
      summary: Your own rating of this company, if you have one
      description: >-
        Used to pre-fill the form and to show the done state on the company page. Returns
        {"review": null} when the caller has not rated it.
      tags:
        - CompanyRatings
      parameters:
        - in: path
          name: companySlug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Your rating, or null
        '401':
          description: Unauthorized
        '404':
          description: Company not found

  /api/company-ratings/{ratingId}:
    delete:
      operationId: deleteCompanyRating
      summary: Withdraw your rating of a company
      tags:
        - CompanyRatings
      parameters:
        - in: path
          name: ratingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Withdrawn
        '401':
          description: Unauthorized
        '404':
          description: Not found, or not yours

  /api/interviews/{reviewId}:
    put:
      operationId: updateInterviewReview
      summary: Replace one of your own interview reviews
      description: >-
        Ownership is enforced in the UPDATE itself, so there is no window between checking and
        writing. Rounds are replaced wholesale rather than merged - an edit supplies the full list,
        and merging would strand rounds from the old process inside the new one.
      tags:
        - Interviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewReviewRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReview'
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '404':
          description: Not found, or not yours
    delete:
      operationId: deleteInterviewReview
      summary: Soft-delete one of your own interview reviews
      tags:
        - Interviews
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Invalid review id
        '401':
          description: Unauthorized
        '404':
          description: Review not found

  /api/users/me/has-interview-contributed:
    get:
      operationId: hasInterviewContributed
      summary: Whether the authenticated user has submitted an interview review
      tags:
        - Interviews
      responses:
        '200':
          description: Contribution status
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasContributed:
                    type: boolean
        '401':
          description: Unauthorized

  /api/industries/interview-averages:
    get:
      operationId: getIndustryInterviewAverages
      summary: Interview experience averages per industry (public)
      tags:
        - Interviews
      security: []
      responses:
        '200':
          description: Per-industry interview averages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        industry:
                          type: string
                        reviewCount:
                          type: integer
                        avgRating:
                          type: number
                          nullable: true
                        avgDifficulty:
                          type: number
                          nullable: true

  /api/industries/listing:
    get:
      operationId: getIndustryListing
      summary: Browse industries with aggregate stats (public)
      tags:
        - Industries
      security: []
      responses:
        '200':
          description: One entry per industry with company/manager/review counts and avg rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        industry:
                          type: string
                        slug:
                          type: string
                        companyCount:
                          type: integer
                        managerCount:
                          type: integer
                        totalReviews:
                          type: integer
                        avgRating:
                          type: number
                          nullable: true

  /api/industries/by-slug/{slug}:
    get:
      operationId: getIndustryProfile
      summary: Get an industry profile with stats and its companies (public)
      tags:
        - Industries
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Industry profile with stats and companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  industry:
                    type: string
                  slug:
                    type: string
                  companyCount:
                    type: integer
                  managerCount:
                    type: integer
                  totalReviews:
                    type: integer
                  avgRating:
                    type: number
                    nullable: true
                  categoryAverages:
                    type: object
                  companies:
                    type: array
                    items:
                      type: object
        '404':
          description: Industry not found

  /api/companies/by-name:
    get:
      operationId: getCompanyProfile
      summary: Get company profile with aggregated stats and manager list (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: company
          required: true
          schema:
            type: string
        # The identity the reader CHOSE in the picker, so the page can render the logo they
        # clicked rather than one guessed from the name. Optional, and never trusted on sight:
        # the server validates it and applies it only where it improves what is stored.
        - in: query
          name: pickedDomain
          required: false
          schema:
            type: string
            nullable: true
        - in: query
          name: pickedLogoUrl
          required: false
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  logoUrl:
                    type: string
                  managerCount:
                    type: integer
                  totalReviews:
                    type: integer
                  avgRating:
                    type: number
                  categoryAverages:
                    type: object
                  managers:
                    type: array
                    items:
                      type: object
        '400':
          description: company parameter missing
        '404':
          description: Company not found

  /api/companies:
    post:
      operationId: createCompany
      summary: Create a company, or return the existing one that name resolves to
      description: >
        The single place a company is brought into existence from a name. Every other write path
        takes a company ID, so this is what a client calls when the user explicitly chooses to add
        a company the picker did not offer. Returns the ID the caller then uses.


        Idempotent by design: an existing company with the same normalised name is returned rather
        than duplicated, so a double submit cannot create two.
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: The company, existing or newly created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  created:
                    type: boolean
                    description: False when an existing company was returned.
        '400':
          description: Missing or invalid name
        '401':
          description: Unauthorized

    get:
      operationId: getCompanies
      summary: Get distinct company names (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: List of distinct company names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string

  /api/company-locations/suggest:
    get:
      operationId: suggestCompanyLocations
      summary: Suggest places for a company - coarse geography and exact workplaces (public)
      description: >
        The company is always known before this is called, so this is not general maps search.
        Results are that company's places, narrowed by whatever geography the caller has already
        settled on. Both kinds are returned: a `geo` row is a place on the map and is always a
        valid answer on its own; a `place` row is a specific building.
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: companyId
          required: false
          schema:
            type: integer
            format: int64
        - in: query
          name: company
          required: false
          schema:
            type: string
        - in: query
          name: country
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching locations, coarse and exact
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [geo, place]
                    label:
                      type: string
                    detail:
                      type: string
                    country:
                      type: string
                    state:
                      type: string
                    city:
                      type: string
                    precision:
                      type: string
                      enum: [country, state, city, exact]
                    companyLocationId:
                      type: integer
                      format: int64
  /api/companies/suggest:
    get:
      operationId: suggestCompanies
      summary: Suggest company names matching a query (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of matching company suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    # The company's identity. A client that selects a suggestion sends this back
                    # on write, so the display name is never re-resolved into an identity.
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                    logoUrl:
                      type: string
                    industry:
                      type: string

  /api/geo:
    get:
      operationId: getGeo
      summary: Resolve the visitor's country/state/city from Cloudflare headers (public)
      tags:
        - Managers
      security: []
      responses:
        '200':
          description: Visitor geo (any field may be null off Cloudflare)
          content:
            application/json:
              schema:
                type: object
                properties:
                  country:
                    type: string
                    nullable: true
                  state:
                    type: string
                    nullable: true
                  city:
                    type: string
                    nullable: true

  /api/managers/similar:
    get:
      operationId: getSimilarManagers
      summary: Find similar managers for duplicate detection (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: company
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of similar managers
          content:
            application/json:
              schema:
                type: object

  /api/managers/find-or-create:
    post:
      operationId: findOrCreateManager
      summary: Search for a manager by structured fields; auto-creates one on first search if not found (auth required)
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - title
                - company
                - country
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Search results (may include a newly created manager)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  created:
                    type: boolean

  /api/managers/ghost:
    post:
      operationId: createGhostManager
      summary: Capture manager intent as a ghost record — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                # PHASE 1. One attempt at the add-manager form. The ledger row is claimed in the
                # same transaction as the captured draft, so however many times this is called for
                # one form session - a reload, a retry, a second tab - that attempt produces at
                # most one manager, and the submission that follows adopts exactly that one.
                #
                # Ignored on the search path (fromSearch), which has its own once-per-visitor
                # allowance and publishes a ghost rather than writing a draft. The two intents this
                # endpoint serves are deliberately different.
                captureToken:
                  type: string
                  format: uuid
                  nullable: true
                  description: Client-generated UUID identifying this attempt at the add-manager form
      responses:
        '200':
          description: Existing manager found — no new record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean
        '201':
          description: New ghost manager created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created:
                    type: boolean

  /api/managers/anonymous-capture:
    post:
      operationId: captureAnonymousSearch
      summary: Silently create a pending_approval manager from an anonymous search — no auth required
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Only the name is required here. This endpoint captures a search somebody made and
              # did not complete, so requiring every field rejected exactly the searches worth
              # keeping: a name plus a company, or a name plus a job title. The service then
              # requires the name and at least one of company or title - the line between "an
              # admin can act on this" and "two strangers happen to share a name".
              required:
                - name
              properties:
                name:
                  type: string
                company:
                  type: string
                  nullable: true
                title:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Accepted — pending manager queued for admin review (nothing returned to caller)
        '400':
          description: Validation error

  /api/managers/drop-off:
    post:
      operationId: createDropOffDraft
      summary: Capture full drop-off form data (manager + review) without authentication
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - country
                - review
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                title:
                  type: string
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID linking this drop-off draft to a future authenticated submit for deduplication
                review:
                  type: object
                  required:
                    - author
                    - overallRating
                    - ratings
                    - workedFrom
                    - managerCompany
                    - managerTitle
                  properties:
                    author:
                      type: string
                    overallRating:
                      type: number
                    ratings:
                      type: object
                    workedFrom:
                      type: string
                    workedUntil:
                      type: string
                    datesHidden:
                      type: boolean
                      default: false
                      description: >-
                        Do not publish the working period. Declared HERE as well as on
                        ManagerReviewInput because this endpoint carries its own inline review
                        schema: the router drops any property a schema does not name, so the
                        field reached the handler as absent and every submission saved as
                        "not hidden" however the box was ticked.
                    effectiveWorkedUntil:
                      type: string
                      nullable: true
                    managerCompany:
                      type: string
                    managerTitle:
                      type: string
      responses:
        '200':
          description: Manager already existed — review attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean
        '201':
          description: New pending manager created with review
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  created:
                    type: boolean

  /api/managers/role-claim-draft:
    post:
      operationId: autosaveRoleClaim
      summary: Save the contributor's manager and employment selection as a draft
      description: >
        Autosave for the role-aware form, so a reload or a sign-in does not lose the selection.
        Never finalizes, never resolves and never charges a rating opportunity: it is a safety net
        for unfinished work, and the submission is the act.

        REVISION GUARDED. A field is overwritten only while the claim is still a draft AND the
        incoming revision is strictly newer, so an autosave in flight when a newer one lands cannot
        win on arrival. A FINALIZED claim is immutable to this: once the rating is submitted the
        claim is a saved observation, and a late autosave from a tab left open must not rewrite the
        assertion behind a published rating.

        PATHS 1 AND 2 ONLY. role_claims.manager_id is NOT NULL, so a claim cannot exist before the
        manager does. A path-3 draft - "none of these people" - answers saved=false with
        reason=no_manager_selected_yet, and belongs in the existing captured_drafts drop-off
        capture instead, which publishes nothing.

        FEATURE GATED. Returns 404 unless ROLE_AWARE_SUBMISSION_ENABLED is set.
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proposalKey
              properties:
                proposalKey:
                  type: string
                  format: uuid
                revision:
                  type: integer
                  format: int64
                  default: 1
                managerId:
                  type: integer
                  format: int64
                  nullable: true
                  description: Null means path 3, and the response says so rather than failing.
                selectedRoleId:
                  type: integer
                  format: int64
                  nullable: true
                title:
                  type: string
                  nullable: true
                company:
                  type: string
                  nullable: true
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                startDate:
                  type: string
                  nullable: true
                endDate:
                  type: string
                  nullable: true
                stillThere:
                  type: boolean
                  nullable: true
      responses:
        '200':
          description: The draft as the server now holds it
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
                  claimId:
                    type: integer
                    format: int64
                  revision:
                    type: integer
                    format: int64
                    description: >
                      What the server now holds, which may be NEWER than what was sent if another
                      tab got there first. The client adopts it rather than counting on its own.
                  finalized:
                    type: boolean
                    description: The rating is already submitted, so stop autosaving.
                  resolved:
                    type: boolean
        '400':
          description: The request is incomplete, or the manager is unavailable
        '404':
          description: The role-aware flow is disabled

  /api/managers/rate-with-role:
    post:
      operationId: rateWithRole
      summary: Submit a rating against an explicitly chosen manager and employment
      description: >
        The role-aware submission. The contributor has already said which person they mean and
        which job they worked under, and this records that decision together with their rating in
        ONE transaction: the claim is finalized, resolved, the rating written and the rating
        opportunity charged, or none of it happens.

        NOTHING HERE IS INFERRED. An omitted selectedRoleId means "the employment is missing, add
        it", which is what the contributor chose; it is never resolved to the closest matching
        record. An absent managerId means "none of these people", and the manager is created
        explicitly rather than matched by name similarity. This endpoint never reaches the fuzzy
        attachment in createManager, which is the behaviour the whole phase removes.

        IDS ARE VERIFIED, NOT TRUSTED. A managerId the client sends must name a publicly visible
        manager, and a selectedRoleId must belong to that manager at that employer and be in a
        usable state, both checked server-side regardless of where the id came from.

        FEATURE GATED. Returns 404 unless ROLE_AWARE_SUBMISSION_ENABLED is set.
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - title
                - company
                - overallRating
                - ratings
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                  description: The job title the rating concerns.
                company:
                  type: string
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                managerId:
                  type: integer
                  format: int64
                  nullable: true
                  description: >
                    The person they picked. Null means "none of these people", so the manager is
                    created as pending_approval.
                selectedRoleId:
                  type: integer
                  format: int64
                  nullable: true
                  description: >
                    The employment they picked. Null means the employment is missing and is being
                    proposed. NEVER inferred from the other fields.
                proposalKey:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    The form's own identity, stable across autosaves and retries. What makes a
                    repeated submission idempotent rather than duplicated.
                revision:
                  type: integer
                  format: int64
                  default: 1
                  description: Guards ordering, so an autosave in flight cannot overwrite a newer one.
                startDate:
                  type: string
                  nullable: true
                  description: The contributor's own employment period start. "2023-04" or a full date.
                endDate:
                  type: string
                  nullable: true
                stillThere:
                  type: boolean
                  nullable: true
                status:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                author:
                  type: string
                  nullable: true
                overallRating:
                  type: number
                ratings:
                  type: object
                  description: The ten categories, by name.
      responses:
        '200':
          description: The rating, and whether it is public yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviewId:
                    type: string
                    format: uuid
                  claimId:
                    type: integer
                    format: int64
                  roleId:
                    type: integer
                    format: int64
                    nullable: true
                  resolution:
                    type: string
                    description: linked when it attached to an existing employment, created when it made one.
                  live:
                    type: boolean
                    description: >
                      False is normal, not a failure: a proposed employment holds the rating until
                      a moderator accepts it.
                  heldBecause:
                    type: string
                    nullable: true
                  replayed:
                    type: boolean
                    description: True when this submission had already been recorded and nothing new was written.
        '400':
          description: The selection is stale or the request is incomplete
        '404':
          description: The role-aware flow is disabled
        '409':
          description: The contributor has no rating opportunity left for this manager

  /api/managers/identify:
    post:
      operationId: identifyManager
      summary: Who the contributor might mean, and which jobs they could pick
      description: >
        Read-only. Returns the managers whose name might match and the employments each of them
        has, so the CONTRIBUTOR chooses the person and the job. Creates nothing: no manager, no
        company, no claim, no review.

        This exists because the legacy path decided for them. It took a typed name, found
        candidates by exact company, ran an edit-distance comparison and attached the rating to
        whichever manager was within one edit of what was typed. One person accumulated eight
        profiles that way and twenty-one people ended up with two public profiles each, their
        reviews split between them.

        Fuzzy matching may help somebody FIND a manager here. It never decides who that manager
        is, and nameClass is returned so a PLAUSIBLE candidate can be shown differently from a
        CONFIRMED one rather than being pre-selected.

        FEATURE GATED. Returns 404 unless ROLE_AWARE_SUBMISSION_ENABLED is set, so the endpoint
        does not exist as far as the public is concerned until the whole flow is ready.
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                # nullable, every one of them. A contributor who knows the name and not the
                # employer must still get candidates: company and title only classify and rank,
                # they never filter a name match out. An earlier release broke /find outright by
                # omitting nullable here while the handler happily sent null.
                title:
                  type: string
                  nullable: true
                company:
                  type: string
                  nullable: true
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                country:
                  type: string
                  nullable: true
                  description: >
                    Where the contributor worked with this manager. A TIE-BREAK, never a filter:
                    among candidates the matcher already rates equally it prefers the one in this
                    country, and it never hides a name match, never changes a match band and never
                    reaches what gets created. People relocate, the column is often empty, and a
                    manager's recorded country is where their current employer is rather than
                    where the contributor worked with them - so filtering on it would be the
                    fuzzy-match mistake in a new form.
      responses:
        '200':
          description: Candidates with their selectable employments
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    description: >
                      Every public manager whose name is CONFIRMED or PLAUSIBLE, each carrying its
                      employments. An empty array means nobody matched, which is the third Rev 268
                      path: propose the manager.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        company:
                          type: string
                          nullable: true
                        title:
                          type: string
                          nullable: true
                        employments:
                          type: array
                          items:
                            type: object
                            properties:
                              roleId:
                                type: integer
                                format: int64
                                nullable: true
                                description: >
                                  Null for the manager's current role when no career_history row
                                  backs it, which search-created managers never have. Such an
                                  employment is NOT selectable: picking it is the "employment
                                  missing" path and proposes the role.
                              companyId:
                                type: integer
                                format: int64
                                nullable: true
                              company:
                                type: string
                                nullable: true
                              title:
                                type: string
                                nullable: true
                              state:
                                type: string
                                description: proposed or accepted. A proposed employment holds the rating until a moderator accepts it.
                              periodKnown:
                                type: boolean
                              startDate:
                                type: string
                                nullable: true
                              endDate:
                                type: string
                                nullable: true
                              selectable:
                                type: boolean
                              isCurrentRoleWithoutRecord:
                                type: boolean
                  nameClass:
                    type: string
                    enum: [CONFIRMED, PLAUSIBLE, NONE]
                  incompleteEvidence:
                    type: boolean
                    description: >
                      The candidate budget truncated the scan, so the list is not exhaustive. Say
                      "there may be others" rather than implying it is complete.
                  entered:
                    type: object
                    description: What was searched, echoed so the client can show it beside "none of these".
        '404':
          description: The role-aware flow is disabled

  /api/managers/search:
    post:
      operationId: searchManagers
      summary: Submit a completed manager search
      description: >
        A COMPLETED four-field search, as opposed to the read-only discovery served by
        GET /api/managers. This is a POST because it WRITES: a finished search resolves the
        company and creates it when we do not hold it yet, which is a state change and must not
        sit behind a GET. A crawler, a link prefetch or a retried URL would otherwise create
        company rows on its own.

        Matching itself is identical to the GET, and nothing here publishes a manager. Manager
        creation stays with find-or-create and the ghost endpoint.
      tags:
        - Managers
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                title:
                  type: string
                  nullable: true
                company:
                  type: string
                  nullable: true
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                  description: A company the person PICKED from suggestions, if any. Validated server-side.
                limit:
                  type: integer
                  default: 8
                offset:
                  type: integer
                  default: 0
      responses:
        '200':
          description: Ranked matches for the submitted name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  total:
                    type: integer
                  hasMore:
                    type: boolean
                  moreMatchesMayExist:
                    type: boolean
                    description: >
                      The candidate scan hit its budget, so classification may be incomplete.
                      This is NOT the same as hasMore, which only says another page exists.
        '400':
          description: Missing or invalid name

  /api/managers:
    get:
      operationId: getManagers
      summary: List managers (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: search
          schema:
            type: string
          description: Optional. Case-insensitive search across name, company, and title.
        - in: query
          name: company
          schema:
            type: string
          description: Optional. Filter by exact company name (case-insensitive).
      responses:
        '200':
          description: Paginated list of managers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ManagerSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer

    post:
      operationId: createManager
      summary: Create a new manager
      tags:
        - Managers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - company
                - title
                - image
                - status
                - country
              properties:
                name:
                  type: string
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so two spellings of
                # one company can no longer create two.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                country:
                  type: string
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                declaredCountry:
                  type: string
                  nullable: true
                  description: Country the contributor confirmed for this manager.
                declaredState:
                  type: string
                  nullable: true
                declaredCity:
                  type: string
                  nullable: true
                declaredPrecision:
                  type: string
                  nullable: true
                  enum: [country, state, city, exact]
                  description: >
                    How specific the declaration is. Stated rather than inferred from which fields
                    happen to be filled, so "city only" and "we only knew the city" stay distinct.
                companyLocationId:
                  type: integer
                  format: int64
                  nullable: true
                  description: An existing company_locations row, at exact precision.
                corpusPlace:
                  type: object
                  nullable: true
                  description: >
                    A building chosen from the search corpus, which has no id yet. Sent instead of
                    companyLocationId; the server promotes it to a real location on submit, so rows
                    are only created for places somebody actually picked.
                  properties:
                    sourcePlaceId: { type: string }
                    name:          { type: string }
                    brandName:     { type: string, nullable: true }
                    street:        { type: string, nullable: true }
                    city:          { type: string, nullable: true }
                    stateCode:     { type: string, nullable: true }
                    countryCode:   { type: string, nullable: true }
                    postalCode:    { type: string, nullable: true }
                linkedinUrl:
                  type: string
                  nullable: true
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID from drop-off draft; matching anonymous review is deleted before inserting the authenticated one
                # PHASE 1. The add-form attempt this submission finishes. Minted by the client when
                # step one first posts its capture and presented again here, so the draft that
                # capture left behind is adopted by identity rather than because some row resembles
                # what was typed. Resolved in the same transaction as the rating, so a submission
                # that fails leaves the attempt unspent and a retry can still adopt its own draft.
                captureToken:
                  type: string
                  format: uuid
                  nullable: true
                  description: Client-generated UUID identifying this attempt at the add-manager form
      responses:
        '201':
          description: Manager created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'

  /api/managers/{id}:
    get:
      operationId: getManagerById
