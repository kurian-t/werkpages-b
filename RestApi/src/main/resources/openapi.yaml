          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        '200':
          description: Proposed employments
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/admin/moderation/employments/{roleId}:
