  /api/admin/captured-drafts:
    get:
      operationId: getAdminCapturedDrafts
      summary: Contribution forms somebody filled in but never submitted
      description: >-
        Only forms with no domain row to create appear here. The manager forms capture into real
        pending_approval rows, which have their own queue; listing them twice would mean reviewing
        one submission in two places.
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: Unreviewed drafts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer, format: int64 }
                        kind:        { type: string, enum: [company_rating, interview, manager_review] }
                        payload:     { type: object }
                        companyId:   { type: integer, format: int64, nullable: true }
                        companyName: { type: string, nullable: true }
                        companySlug: { type: string, nullable: true }
                        managerId:   { type: integer, format: int64, nullable: true }
                        managerName: { type: string, nullable: true }
                        author:      { type: string, nullable: true }
                        createdAt:   { type: string }
                        publishable: { type: boolean }
                        blockedReason:
                          type: string
                          nullable: true
                          description: >-
                            Why this draft cannot be published, from the same validator the public
                            form runs. Null when it can be.
                  total:  { type: integer }
                  limit:  { type: integer }
                  offset: { type: integer }
        '403':
          description: Not an admin

  /api/admin/captured-drafts/{draftId}/reviewed:
    post:
      operationId: markCapturedDraftReviewed
      summary: Mark one captured draft as dealt with
      description: Kept rather than deleted, so the queue can be audited.
      tags:
