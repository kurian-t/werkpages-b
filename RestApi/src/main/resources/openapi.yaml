  /api/admin/deduplication/run:
    post:
      operationId: triggerDeduplication
      summary: Trigger the AI deduplication job immediately (admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Job started
        '503':
          description: Job not configured

  /api/roles/suggest:
    get:
      operationId: suggestRoles
      summary: Title suggestions for the add-manager form (public)
      description: >-
        Offers the spellings other people already used, which is what stops new variants being
        created. Draws on manager titles and interview roles together, since they are the same
        vocabulary. The query is normalized before matching, so "sr" finds "Senior Manager"; what
        comes back is the most common real spelling in each normalized group.
      tags:
        - Managers
      security: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching titles, prefix matches and common spellings first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      description: The most common real spelling, which is what a person expects to pick.
                      type: string
                    normalized:
                      type: string
                    usageCount:
                      description: >-
                        How many managers and interview reviews use this spelling. Drives the
                        ordering so the most common form is first; not shown in the UI.
                      type: integer

  # ── Role normalization ──────────────────────────────────────────────────────
  # Titles are free text, so the same job arrives as "Senior Manager", "Sr. Manager" and "sr mgr".
  # The database normalizes the string on write (V49); these endpoints assign meaning to the
  # result and let an admin review and correct it.

  /api/admin/roles:
    get:
      operationId: listRoleAliases
      summary: Distinct normalized titles and what they were classified as, most common first
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
        - in: query
          name: offset
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Alias table plus corpus coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAliasListing'
        '401':
          description: Unauthorized
        '403':
          description: Not an admin

    put:
      operationId: setRoleAlias
      summary: Correct one title mapping by hand
      description: >-
        Marks the row as manually classified, which puts it out of reach of every automated pass.
        A human correction is the best signal available and must not be undone by the next sweep.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titleNormalized]
              properties:
                titleNormalized:
                  type: string
                roleFamily:
                  type: string
                  nullable: true
                  enum: [engineering, product, design, data, it, sales, marketing,
                         customer_support, operations, finance, hr, legal,
                         project_management, research, education, healthcare, general, other]
                seniority:
                  type: string
                  nullable: true
                  enum: [lead, manager, senior_manager, director, vp, executive]
      responses:
        '204':
          description: Updated
        '400':
          description: Unknown family or seniority, or nothing to set
        '401':
          description: Unauthorized
        '403':
          description: Not an admin

  /api/admin/roles/classify:
    post:
      operationId: classifyRoles
      summary: Classify one batch of not-yet-seen titles using the rule engine
      description: >-
        Synchronous, unlike the AI jobs — the rules are pure string work over at most a few hundred
        titles. Re-run until `remaining` reaches zero.
      tags:
        - Admin
      responses:
        '200':
          description: What the pass did, plus resulting coverage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RoleCoverage'
                  - type: object
                    properties:
                      classified:
                        type: integer
                      unreadable:
                        description: Titles recorded with no family and no seniority — the work list for a later AI pass.
                        type: integer
        '401':
          description: Unauthorized
        '403':
          description: Not an admin

  /api/admin/industries/classify:
    post:
      operationId: classifyIndustries
      summary: Back-fill industry classification for all unclassified companies (admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Classification started
        '503':
          description: Job not configured (ANTHROPIC_API_KEY missing)

  /api/admin/merge-suggestions:
    get:
      operationId: getMergeSuggestions
      summary: Get pending AI-generated merge suggestions (admin only)
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of merge suggestions
        '403':
          description: Forbidden

  /api/admin/merge-suggestions/{id}/dismiss:
    post:
      operationId: dismissMergeSuggestion
      summary: Dismiss a merge suggestion (admin only)
      tags:
        - Admin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dismissed
        '403':
          description: Forbidden

  /api/admin/managers/{managerId}/career-history:
    post:
      operationId: adminCreateCareerEntry
      summary: Record a role that has no career-history row yet (admin only)
      description: >
        Only update and delete existed. A trajectory card can come from a career_history row, from
        reviews grouped into a segment, or from the manager record - and only the first could be
        edited, so a role's dates could not be written at all for the other two. That is why a
        manager who had left still showed "Present": with no row to hold an end date, the panel
        fell back to the reviewer's own dates.
      tags:
        - Admin
      parameters:
        - in: path
          name: managerId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, title, startDate]
              properties:
                company:   { type: string }
                title:     { type: string }
                startDate: { type: string }
                endDate:   { type: string, nullable: true }
      responses:
        '200':
          description: Created
        '400':
          description: Invalid input
        '403':
          description: Forbidden

  /api/admin/managers/{managerId}/career-stage:
    post:
      operationId: adminResolveCareerStage
      summary: Delete, reassign or merge a career stage, including one with no career-history row (admin only)
      tags:
        - Admin
      parameters:
        - name: managerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, company, title]
              properties:
                action:
                  type: string
                  enum: [delete, reassign, merge]
                  description: >-
                    delete removes the stage's employment periods and, when the last one goes, its
                    ratings. reassign moves the stage's RATINGS onto another role and touches no
                    employment record at all. merge declares the two stages to be one employment
                    recorded twice and is the only action that alters employment history: it
                    supersedes the source role through ManagerMergeService.mergeRoles, redirecting
                    its claims with an audit, and then moves the ratings. reassign used to merge or
                    delete the source role on its own initiative; it no longer does, because
                    correcting what a rating was filed under is not a statement about employment.
                company:
                  type: string
                  description: The stage's company, as it appears on the trajectory.
                title:
                  type: string
                  description: >-
                    The stage's title, as it appears on the trajectory. Required, because a stage
                    is the (company, title) pair the chart groups on and a manager can hold more
                    than one role at one employer. Identifying a stage by its company alone made
                    a delete take every role at that employer, ratings included.
                toCompany:
                  type: string
                  nullable: true
                  description: Required to reassign or merge. The company of the role on the other side.
                toTitle:
                  type: string
                  nullable: true
                  description: >-
                    Required to reassign or merge. The title of the role on the other side. May
                    share toCompany with the source: a promotion at one employer is two roles
                    there, and moving ratings between them is the common case.
                careerHistoryId:
                  type: integer
                  format: int64
                  nullable: true
                  description: >-
                    Which employment period of the source stage to act on. A stage is a
                    (company, title) pair and that pair is not unique: somebody can leave an
                    employer and return to the same title, and the chart draws both periods as one
                    tile. A destructive action on such a stage is refused until this names the
                    period, and the refusal lists them with their dates. Required on a merge when
                    the source stage covers more than one period.
                toCareerHistoryId:
                  type: integer
                  format: int64
                  nullable: true
                  description: >-
                    Which employment period of the target stage to merge into. Required on a merge
                    when the target stage covers more than one period.
                allPeriods:
                  type: boolean
                  nullable: true
                  description: >-
                    On a delete, says that every employment period behind the stage is meant rather
                    than one of them. Without it a stage covering several periods is refused, so
                    that two separate jobs are never removed by a request that named neither.
                confirmRealReviews:
                  type: boolean
                  nullable: true
                  description: >-
                    Required to delete a stage that holds genuine reviews. Without it the request is
                    refused and the count is returned in the message, so the caller can say what is
                    about to be destroyed.
      responses:
        '200':
          description: Stage resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  action:
                    type: string
                  reviewsAffected:
                    type: integer
                    description: Ratings deleted, moved, or carried across by a merge.
                  entriesDeleted:
                    type: integer
                    description: career_history periods removed. Always 0 for reassign and merge.
                  rolesSuperseded:
                    type: integer
                    description: Roles mergeRoles superseded. Only ever nonzero for merge.
                  merged:
                    type: boolean
                  sourceEmploymentKept:
                    type: boolean
                    description: >-
                      True after a reassign, where the ratings moved and the source employment
                      period deliberately stayed. The caller can say so rather than leaving an
                      admin to wonder why the stage is still drawn.
        '400':
          description: >-
            Bad request; refused because the stage holds real reviews; or refused because the stage
            covers several employment periods and the request named none of them.
        '403':
          description: Forbidden
        '409':
          description: >-
            The merge cannot be performed as asked - the two stages sit at different employers, or
            a side has no employment record to supersede.
