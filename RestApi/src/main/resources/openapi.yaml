              properties:
                roleId:
                  type: integer
      responses:
        '200':
          description: Linked
        '400':
          description: Target employment is not available, or the claim was never finalized
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: No such claim

