  /api/admin/company-stats/maintain:
    post:
      operationId: maintainCompanyStats
      summary: >-
        Run company-statistics maintenance now (admin only). Optional: the projection is maintained
        by database triggers on every write and repaired automatically every six hours.
      description: >-
        Detects discrepancies between company_stats_live and its source tables, records them in
        company_stats_drift_log, repairs the affected companies through the shared database
        implementation, and verifies the result. Cannot overlap the scheduled sweep or the other
        backend's: ran=false means another maintenance run holds the lock.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Maintenance outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  ran:
                    type: boolean
                    description: False when another maintenance run holds the cross-process lock.
                  driftFound:
                    type: integer
                    description: Number of individual discrepancies detected.
                  companiesRepaired:
                    type: integer
                  stillDrifted:
                    type: integer
                    description: Discrepancies that survived the repair. Non-zero needs investigation.
                  summary:
                    type: string
        '503':
          description: Maintenance not configured

