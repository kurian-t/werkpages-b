        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                company:
                  type: string
                # Identity of a company chosen from the typeahead. When present the server
                # uses it directly and treats `company` as display text, so correcting a name
                # cannot silently mint a duplicate company.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                title:
                  type: string
                image:
                  type: string
                bio:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum: [active, retired]
                country:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                  nullable: true
