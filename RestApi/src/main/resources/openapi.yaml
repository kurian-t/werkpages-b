          nullable: true
        managerRoleStart:
          type: string
          nullable: true
        managerRoleEnd:
          type: string
          nullable: true
        declaredCountry:
          type: string
          nullable: true
          description: Country the contributor confirmed for this opinion.
        declaredState:
          type: string
          nullable: true
        declaredCity:
          type: string
          nullable: true
        declaredPrecision:
          type: string
          nullable: true
          enum: [country, state, city, exact]
          description: >
            How specific the declaration is. Its ABSENCE means "leave the stored location alone" -
