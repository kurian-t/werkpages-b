      properties:
        success:
          type: boolean
        auth0LogoutUrl:
          type: string
          description: >
            Where the browser should navigate to end the Auth0 session as well. The product
            session is already revoked by the time this is returned; this only stops Auth0
            recognising the person and signing them straight back in.

    ManagerReviewUpdated:
