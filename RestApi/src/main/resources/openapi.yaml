      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Candidates
        '403':
          description: Forbidden

  /api/admin/managers/{managerId}/reclaim-slug:
