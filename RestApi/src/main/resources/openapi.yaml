    post:
      operationId: rebuildCompanyStats
      summary: Recompute company_stats_live for every company (admin only)
      description: >-
        The escape hatch, separate from maintenance on purpose. Maintenance is bounded and repairs
        only what disagrees; this walks every company and is appropriate when the projection is
        believed wrong in a way detection might share, such as after a restore.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rebuild complete
          content:
            application/json:
              schema:
                type: object
                properties:
