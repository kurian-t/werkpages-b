  /api/managers/{id}/career-segments:
    get:
      operationId: getManagerCareerSegments
      summary: Get pre-aggregated career segments for the timeline (all reviews, grouped by company+role)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aggregated career segments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        company:
                          type: string
                        role:
                          type: string
                        startDate:
                          type: string
                          nullable: true
                        endDate:
                          type: string
                          nullable: true
                        isCurrent:
                          type: boolean
                        averageRating:
                          type: number
                        reviewCount:
                          type: integer
                        categoryAverages:
                          type: object
                          additionalProperties:
                            type: number
                        careerPeriods:
                          type: array
                          description: >-
                            The same rows with the dates that distinguish them. One segment can be
                            two separate JOBS: somebody can leave an employer and return to the
                            same title, and career_unique_known_employment permits that whenever
                            the start days differ. A destructive admin action on such a segment is
                            refused until the request names the period, so the choice is sent with
                            the segment rather than discovered one error message at a time.
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                              startDate:
                                type: string
                                format: date
                                nullable: true
                              endDate:
                                type: string
                                format: date
                                nullable: true
                        careerHistoryIds:
                          type: array
                          description: >-
                            The career_history rows this segment is grouped from. Empty when the
                            segment exists only because a rating names the role and nobody
                            recorded the employment. Sent so a client never has to identify the
                            row by company name, which picks the wrong one for a manager holding
                            two roles at one employer.
                          items:
                            type: integer
                            format: int64
                        careerHistoryId:
                          type: integer
                          format: int64
                          nullable: true
                          description: >-
                            The single row behind the segment, or null when there is none or more
                            than one. The convenience form of careerHistoryIds.
        '400':
          description: Invalid manager ID

  /api/managers/{id}/report:
    post:
      operationId: reportManager
      summary: Report an inaccurate or incorrect manager profile
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum: [incorrect_person, never_worked_here, duplicate_profile, incorrect_information, other]
                comment:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Report submitted successfully
        '401':
          # Reporting requires an account. The profile page keeps a half-written report in
          # sessionStorage, sends the visitor to sign up and posts it on the way back, so a guest
          # never loses the report - but the endpoint itself is closed to one, and the contract
          # said nothing about that until V114's queue made the whole path worth stating.
          description: Not signed in
        '400':
          description: Missing or invalid reason
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Manager not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/managers/{id}/employments:
    get:
      operationId: getManagerEmployments
      summary: The manager's employments, each with the id the career editor identifies it by
      # Opts out of the global bearerAuth requirement, which is what makes it public. Without this
      # the spec enforces a token and a logged-out visitor opening the editor gets a 401 - the
      # fields would be hidden behind sign-in, which is the one thing a contribution form must
      # never do.
      security: []
      description: >
        Unauthenticated on purpose. A logged-out visitor must be able to open the career editor and
        fill it in, being asked to sign in only at submit, so this read cannot require an account.
        It publishes nothing the public profile does not.


        Distinct from the profile's trajectory, which groups two spells at one employer into a
        single tile for display. An editor has to address each employment on its own, and needs the
        employment status and per-employment location the trajectory does not carry.
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The employments a contributor may correct
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                          nullable: true
                          description: career_history.id, the only identifier that distinguishes
                            two spells at one employer. NULL for the position the manager record
                            asserts with no employment row written for it yet.
                        fromManagerRecord:
                          type: boolean
                          description: This entry comes from the manager's own title and company
                            rather than from an employment row. The profile already displays it, so
                            the editor shows it first and the row is written on submit.
                        title:
                          type: string
                        company:
                          type: string
                        companyId:
                          type: integer
                          format: int64
                          nullable: true
                        companyDomain:
                          type: string
                          nullable: true
                        companyLogoUrl:
                          type: string
                          nullable: true
                        startDate:
                          type: string
                          nullable: true
                          description: Year and month, never a fabricated day. Null when unknown.
                        endDate:
                          type: string
                          nullable: true
                        periodKnown:
                          type: boolean
                        employmentStatus:
                          type: string
                          description: ongoing, ended, unknown or disputed. No enum here because an
                            OpenAPI 3.0 enum combined with nullable rejects an explicit null.
                        state:
                          type: string
                        isCurrent:
                          type: boolean
                        claimCount:
                          type: integer
                          format: int64
                          description: Contributors with a resolved claim on this employment.
                            Shown beside a company correction, because superseding moves their
                            claims with it.
                        declaredCountry:
                          type: string
                          nullable: true
                        declaredState:
                          type: string
                          nullable: true
                        declaredCity:
                          type: string
                          nullable: true
                        declaredPrecision:
                          type: string
                          nullable: true
                        companyLocationId:
                          type: integer
                          format: int64
                          nullable: true
                        declaredSource:
                          type: string
                          nullable: true
                        declaredText:
                          type: string
                          nullable: true
        '400':
          description: Invalid manager ID

  /api/managers/{id}/career-edit:
    post:
      operationId: submitCareerEdit
      summary: One contribution correcting any number of a manager's employments, and their name
      description: >
        The whole submission is one coherent contribution: one explanation, one pending proposal per
        contributor per manager, one moderator decision. Nothing is applied until it is approved.


        A position either corrects an existing employment, adds a distinct one, or supersedes one
        whose employer was wrong. Correcting and adding are deliberately different operations:
        adding a current role never ends another, so somebody holding two jobs at once is recorded
        as holding two jobs at once.
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  description: A corrected name for the manager. A submission may change only the
                    name and no employment at all.
                explanation:
                  type: string
                  nullable: true
                  description: Optional, and the form no longer asks for it. The "How do you know?"
                    question was removed from the career editor, so a submission carries none and
                    the column is written NULL. Still accepted, and still capped at 2000
                    characters, because the legacy single-position form collects one.
                positions:
                  type: array
                  description: May be empty when only the name is being corrected.
                  items:
                    type: object
                    required:
                      - intent
                      - changedFields
                    properties:
                      intent:
                        type: string
                        enum: [correct, add, supersede]
                      roleId:
                        type: integer
                        format: int64
                        nullable: true
                        description: career_history.id of the employment being changed. Required for
                          correct and supersede, and must be absent for add. Never identified by
                          company name, which cannot tell two spells at one employer apart.
                      fromManagerRecord:
                        type: boolean
                        nullable: true
                        description: >
                          This position is the one the MANAGER RECORD asserts, with no employment
                          row behind it yet. Sent as an `add` with no roleId, because that is all
                          the client can honestly say.


                          On submit the server writes the row from the manager record and applies
                          the change to it as a correction, so the audit trail, the rating snapshot
                          sync and the staleness check all work on it as on any other employment.
                          Without this marker the same submission would record a second, duplicate
                          employment beside the one the profile is already displaying.
                      changedFields:
                        type: array
                        description: Which of the values below this position actually proposes.
                          Without it a null endDate is ambiguous between "leave it alone" and "this
                          role has no end date after all", which are opposite instructions.
                        items:
                          type: string
                      title:
                        type: string
                        nullable: true
                      company:
                        type: string
                        nullable: true
                        description: An audit snapshot of what the contributor typed. Identity comes
                          from companyId, never from re-resolving this name.
                      companyId:
                        type: integer
                        format: int64
                        nullable: true
                      startDate:
                        type: string
                        nullable: true
                        description: Year and month. Omitted rather than invented when unknown.
                      endDate:
                        type: string
                        nullable: true
                      periodKnown:
                        type: boolean
                        nullable: true
                      employmentStatus:
                        type: string
                        nullable: true
                        description: ongoing, ended or unknown. disputed is a moderation outcome and
                          is refused here and by the database. No enum, because an OpenAPI 3.0 enum
                          with nullable rejects an explicit null.
                      declaredCountry:
                        type: string
                        nullable: true
                      declaredState:
                        type: string
                        nullable: true
                      declaredCity:
                        type: string
                        nullable: true
                      declaredPrecision:
                        type: string
                        nullable: true
                      companyLocationId:
                        type: integer
                        format: int64
                        nullable: true
                      declaredSource:
                        type: string
                        nullable: true
                      declaredText:
                        type: string
                        nullable: true
                      corpusPlace:
                        type: object
                        nullable: true
                        description: A building chosen from the search corpus, which has no id until
                          somebody picks it. Promoted to a real location on submit.
                        additionalProperties: true
      responses:
        '201':
          description: Contribution recorded and pending moderation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  managerId:
                    type: integer
                    format: int64
                  newName:
                    type: string
                    nullable: true
                  explanation:
                    type: string
                  positions:
                    type: integer
                  changeFormat:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
        '400':
          description: The submission contradicts itself, or a position is incomplete
        '401':
          description: Not signed in. The form is never hidden behind this; it is asked at submit.
        '403':
          description: Account suspended
        '404':
          description: Manager or employment not found
        '409':
          description: An employment in the submission is no longer correctable

  /api/managers/{id}/edit-requests:
    post:
      operationId: createManagerEditRequest
      summary: Submit a pending edit request for a manager's company/title
      tags:
        - Managers
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company:
                  type: string
                # Identity of the company the user picked. Approval uses this directly; the
                # `company` name beside it is an audit snapshot, never re-resolved.
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                # The logo and domain shown beside the company the person CHOSE. Optional and
                # untrusted: the server validates the pair and applies it only where it improves
                # the stored identity, so a reader can correct a guessed mark but never flatten a
                # resolved or admin-set one. Without these the pick was discarded in the browser
                # and the profile kept whatever the first person to type that name produced.
                companyLogoUrl:
                  type: string
                  nullable: true
                companyDomain:
                  type: string
                  nullable: true
                title:
                  type: string
                # The location, as the shared LocationField collects it. V70 gave manager_edits
                # somewhere to store these; until the edit form used that control there was
                # nothing to send. Each is optional and independent - an edit about a job title
                # must not blank a location it never asked about.
                country:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                # No enum here on purpose: an OpenAPI 3.0 enum combined with nullable rejects an
                # explicit null unless null is listed, which is the exact shape that broke /find
                # before. The service validates the four allowed values and returns a clear 400.
                precision:
                  type: string
                  nullable: true
                # A building the editor picked. Negative means "no longer at a specific building",
                # which is the only way to clear a field that is otherwise additive.
                companyLocationId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '201':
          description: Edit request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
        '400':
          description: Validation error
        '404':
          description: Manager not found

  /api/managers/{id}/pending-edits:
    get:
      operationId: getManagerPendingEdits
      summary: Get pending edit requests for a manager (public)
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of pending edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  /api/admin/pending-edits:
    get:
      operationId: getAdminPendingEdits
      summary: Get all pending manager edit requests (admin only)
      tags:
        - Admin
      responses:
        '200':
          description: List of pending edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        '403':
          description: Forbidden

  /api/admin/pending-edits/{editId}/change-set:
    get:
      operationId: getEditChangeSet
      summary: The complete set of changes behind one edit request
      description: >
        For a career-editor contribution, the legacy summary columns are all null and the substance
        is in the change set, so the admin screen reads it here.


        Each position carries three accounts of the same employment: what it said when the
        contribution was written, what the contributor proposes, and what it says now. A moderator
        needs all three to tell a correction from a revert, and comparing the first with the last is
        what reveals that somebody else has changed the employment since it was submitted. That
        comparison is reported as `stale`, and it is the same one approval enforces, so a conflict
        is visible while reading rather than discovered when the approval is refused.
      tags:
        - Admin
      parameters:
        - in: path
          name: editId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The contribution and its positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  managerId:
                    type: integer
                    format: int64
                  managerName:
                    type: string
                  changeFormat:
                    type: string
                    description: legacy or career_editor. Read from the row, never inferred from
                      whether a change set exists, because a name-only correction has none.
                  status:
                    type: string
                  explanation:
                    type: string
                    nullable: true
                  currentName:
                    type: string
                  proposedName:
                    type: string
                    nullable: true
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        intent:
                          type: string
                        roleId:
                          type: integer
                          format: int64
                          nullable: true
                        changedFields:
                          type: array
                          items:
                            type: string
                        position:
                          type: integer
                        was:
                          type: object
                          description: The employment at submission time.
                          additionalProperties: true
                        proposed:
                          type: object
                          additionalProperties: true
                        current:
                          type: object
                          description: The employment now.
                          additionalProperties: true
                        stale:
                          type: boolean
                          description: Somebody changed this employment after the contribution was
                            submitted, in a field the contribution proposes. Approving would undo
                            their change, so it is refused until reviewed.
                        needsCompanyResolution:
                          type: boolean
                          description: An add or supersede naming a company with no record yet. The
                            moderator resolves it through the picker before approving.
        '401':
          description: Unauthorized
        '403':
          description: Not an administrator
        '404':
          description: Edit request not found

  /api/admin/pending-edits/{editId}/approve:
    post:
      operationId: approveManagerEdit
      summary: Approve a pending manager edit, optionally correcting it (admin only)
      description: >-
        Approve and Reject could not express the commonest case in this queue: the request is
        right that the manager moved and wrong about one field. Corrections therefore ride on the
        approval and the existing transaction applies them, so manager_edits keeps naming who
        proposed it rather than the contribution being rejected and redone by hand.
        The body is OPTIONAL. A field that is absent leaves the contributor's answer alone.
        companyId is the one that unsticks a request naming a company with no row yet: identity
        comes from a picker, never from re-resolving a typed name.
      tags:
        - Admin
      parameters:
        - in: path
          name: editId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                companyId:
                  type: integer
                  format: int64
                  nullable: true
                company:
                  type: string
                  nullable: true
                companyLogoUrl:
                  type: string
                  nullable: true
                title:
                  type: string
                  nullable: true
                country:
                  type: string
                  nullable: true
                state:
                  type: string
                  nullable: true
                city:
                  type: string
                  nullable: true
                linkedinUrl:
                  type: string
                  nullable: true
                startDate:
                  type: string
                  nullable: true
                  description: YYYY or YYYY-MM, widened to the start of the period
                endDate:
                  type: string
                  nullable: true
                  description: YYYY or YYYY-MM; explicit null clears it, meaning the role has not ended
      responses:
        '200':
          description: Edit approved and applied
        '400':
          description: A correction was not usable, for example an unparseable date
        '403':
          description: Forbidden
        '404':
          description: Edit not found

  /api/admin/reviews:
    get:
      operationId: adminGetReviews
      summary: Recent ratings for moderation (admin only)
      description: >-
        Newest first, excluding already-deleted rows but INCLUDING held ones, since a held rating
        is exactly what a moderator has been asked to look at. Carries the author's standing and
        how many ratings they have ever written, so a first-ever rating from a fresh account -
        the drive-by unlock shape - is visible without opening anything.
      tags:
        - Admin
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Ratings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  total:  { type: integer }
                  limit:  { type: integer }
                  offset: { type: integer }
        '403':
          description: Forbidden

  /api/admin/reviews/{reviewId}:
    delete:
      operationId: adminDeleteReview
      summary: Delete a rating as a moderator (admin only)
      description: >-
        Soft delete. The reason is required and decides consequences: only "junk" debits the
        author's confidence, because a duplicate or an administrative correction is not their
        fault. Unlike an author's own withdrawal this is never auto-restored after three days,
        and the manager's rating and company figures are recomputed before the call returns.
      tags:
        - Admin
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [junk, duplicate, correction, other]
                  description: >-
                    junk = fake or garbage contribution (penalises the author);
                    duplicate and correction carry no penalty; other is a deliberate choice.
      responses:
        '200':
          description: Rating deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reason:
                    type: string
                  confidencePenalty:
                    type: boolean
                  alreadyDeleted:
                    type: boolean
        '400':
          description: Missing or unrecognised reason
        '403':
          description: Forbidden
        '404':
          description: Rating not found

