          type: boolean
          description: True if the user has submitted at least one review

    SignupRequest:
      type: object
      required:
        - email
        - username
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string

    SigninRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Email address or username
        password:
          type: string

    SigninResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/User'

    SignoutResponse:
      type: object
      required:
