components:
  schemas:
    RoleCoverage:
      type: object
      properties:
        distinctTitles:
          type: integer
        classifiedTitles:
          type: integer
        remaining:
          type: integer
        managersTotal:
          type: integer
        managersWithFamily:
          type: integer
        managersWithSeniority:
          type: integer
        familyCoveragePct:
          description: Coverage counted by manager, not by title — a title ten thousand people hold matters more than a hundred one-offs.
          type: integer
        seniorityCoveragePct:
          type: integer

    RoleAliasListing:
      allOf:
        - $ref: '#/components/schemas/RoleCoverage'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  titleNormalized:
                    type: string
                  roleFamily:
                    type: string
                    nullable: true
                  seniority:
                    type: string
                    nullable: true
                  source:
                    type: string
                    enum: [rule, ai, manual]
                  managerCount:
                    type: integer
                  sampleTitle:
                    description: One real title that normalized to this row, so the mapping can be sanity-checked against what someone actually typed.
                    type: string
                    nullable: true

    # ── Interview experience reviews ──────────────────────────────────────────

    InterviewRating:
      type: number
      format: double
      minimum: 0
      maximum: 5
      nullable: true

    InterviewReviewRequest:
      type: object
      required:
        - overallRating
        - outcome
        - interviewYear
      properties:
        overallRating:
          type: number
          format: double
          minimum: 0
          maximum: 5
        communication:
          $ref: '#/components/schemas/InterviewRating'
        respectForTime:
          $ref: '#/components/schemas/InterviewRating'
        roleClarity:
          $ref: '#/components/schemas/InterviewRating'
        processFairness:
          $ref: '#/components/schemas/InterviewRating'
        nextStepTransparency:
          $ref: '#/components/schemas/InterviewRating'
        difficulty:
          description: >-
            1-5, where 5 is hardest. NOT a quality score - a hard interview is not a bad one, so
            this is never folded into overallRating or any "top rated" ranking.
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        outcome:
          description: >-
            Required. Rejected candidates rate a process markedly lower than hired ones, so an
            average that mixes them measures who was most annoyed rather than how the company
            interviews. Collecting it lets the company page show the split instead.
          type: string
          enum: [offer, no_offer, withdrew, pending]
        rounds:
          description: >-
            The shape of the process, in order — "phone screen, then a panel, then a VP
            conversation". Replaces V48's single interviewType plus a count, which could not
            express ordering or more than one format. The count on the stored review is derived
            from this list.
          type: array
          maxItems: 10
          items:
            type: string
            enum: [recruiter_screen, phone, video, hiring_manager, technical, take_home,
                   pair_programming, case_study, panel, onsite, executive]
        processLength:
          type: string
          enum: [under_1_week, 1_2_weeks, 2_4_weeks, over_1_month]
          nullable: true
        roleCategory:
          type: string
          maxLength: 100
          nullable: true
        country:
          description: >-
            Country of the POSITION, not where the candidate lives. Someone in Toronto interviewing
            for a US role went through the US process, and that is what comparisons are about.
            Prefilled from the request's geo headers; the person can change it.
          type: string
          maxLength: 100
          nullable: true
        city:
          description: >-
            Inferred from geo rather than asked for, and cleared when the country is changed away
            from the inferred one. Captured but not yet exposed as a filter: city-level slices need
            sample sizes the site does not have.
          type: string
          maxLength: 100
          nullable: true
        interviewYear:
          description: Hiring processes track the market closely, so year is a filtering axis.
          type: integer

    InterviewReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        overallRating:
          type: number
          nullable: true
        communication:
          $ref: '#/components/schemas/InterviewRating'
        respectForTime:
          $ref: '#/components/schemas/InterviewRating'
        roleClarity:
          $ref: '#/components/schemas/InterviewRating'
        processFairness:
          $ref: '#/components/schemas/InterviewRating'
        nextStepTransparency:
          $ref: '#/components/schemas/InterviewRating'
        difficulty:
          type: integer
          nullable: true
        outcome:
          type: string
          enum: [offer, no_offer, withdrew, pending]
        rounds:
          description: Number of rounds, derived from the per-round detail.
          type: integer
          nullable: true
        processLength:
          type: string
          nullable: true
        roleCategory:
          type: string
          nullable: true
        interviewYear:
          type: integer

    InterviewCategorySeries:
      description: >-
        One population's ratings. A series nobody falls into still appears, with null averages -
        "nobody who was rejected has reported here" is information, and an absent key reads as zero.
      type: object
      properties:
        count:
          type: integer
        overallRating:
          type: number
          nullable: true
        communication:
          type: number
          nullable: true
        respectForTime:
          type: number
          nullable: true
        roleClarity:
          type: number
          nullable: true
        processFairness:
          type: number
          nullable: true
        nextStepTransparency:
          type: number
          nullable: true

    InterviewOutcomeBucket:
      type: object
      properties:
        count:
          type: integer
        avgRating:
          type: number
          nullable: true

    CompanyInterviewStats:
      type: object
      properties:
        reviewCount:
          description: All interview reviews for the company, ignoring any filter. Always public.
          type: integer
        avgRating:
          type: number
          nullable: true
        avgDifficulty:
          type: number
          nullable: true
        medianRounds:
          type: integer
          nullable: true
        outcomeSplit:
          description: >-
            Every outcome is present, including ones with a zero count. An absent key and a zero
            count read the same to a caller checking truthiness but mean different things.
          type: object
          properties:
            offer:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            noOffer:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            withdrew:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
            pending:
              $ref: '#/components/schemas/InterviewOutcomeBucket'
        roleCategories:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              count:
                type: integer
        countries:
          description: Countries this company has interviews for, most reported first.
          type: array
          items:
            type: object
            properties:
              country:
                type: string
              count:
                type: integer
        typicalRounds:
          description: >-
            The usual shape of this company's process, position by position. Mode per round rather
            than an average, because averaging formats is meaningless.
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
              type:
                type: string
              reportedBy:
                type: integer
        role:
          description: The role the comparison chart was narrowed to, or null for all roles.
          type: string
          nullable: true
        categoryComparison:
          description: >-
            Every category rated three ways at once - by everyone, by candidates who received an
            offer, and by those who did not. Null when withheld, on the same gate as
            categoryAverages. Narrowed by the role parameter.
          nullable: true
          type: object
          properties:
            overall:
              $ref: '#/components/schemas/InterviewCategorySeries'
            offer:
              $ref: '#/components/schemas/InterviewCategorySeries'
            noOffer:
              $ref: '#/components/schemas/InterviewCategorySeries'
        categoryAverages:
          description: >-
            Null when withheld. Two distinct reasons, distinguished by the flags below - gated
            (the viewer has not contributed) or belowThreshold (too few reviews to average).
          nullable: true
          type: object
          properties:
            communication:
              type: number
              nullable: true
            respectForTime:
              type: number
              nullable: true
            roleClarity:
              type: number
              nullable: true
            processFairness:
              type: number
              nullable: true
            nextStepTransparency:
              type: number
              nullable: true
        hasContributed:
          type: boolean
        gated:
          type: boolean
        belowThreshold:
          type: boolean
        myInterview:
          description: >-
            The caller's own review for this company, if signed in and they have one. Drives the
            ownership control: once you have contributed, the page offers to edit or remove what
            you wrote instead of asking again.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InterviewReview' 

    ManagerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        country:
          type: string
          nullable: true

    ManagerDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        company:
          type: string
        title:
          type: string
        image:
          type: string
        overallRating:
          type: number
        reviews:
          type: integer
        bio:
          type: string
        status:
          type: string
          enum: [active, retired]
        categoryAverages:
          type: object
