        - email
        - username
        - firstName
        - lastName
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Internal database UUID
        auth0Id:
          type: string
          description: Auth0 user ID
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required:
        - email
        - username
        - firstName
        - lastName
        - password
      properties:
        email:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string

    SigninRequest:
