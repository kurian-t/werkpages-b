  /api/managers/{id}/reviews/drop-off:
    post:
      operationId: createDropOffReview
      summary: Capture a review drop-off for an existing manager without authentication
      tags:
        - Managers
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Only the ratings are required. This endpoint exists to capture a review somebody
              # started and did not finish, so requiring the fields they had not reached yet threw
              # away precisely the submissions it was built to keep: the router rejected the
              # request with a 400 and the client swallowed it. The service already treats these
              # as optional and reviews.worked_from is nullable, so partial captures store fine.
              required:
                - ratings
              properties:
                author:
                  type: string
                overallRating:
                  type: number
                ratings:
                  type: object
                managerCompany:
                  type: string
                  nullable: true
                managerTitle:
                  type: string
                  nullable: true
                workedFrom:
                  type: string
                  nullable: true
                workedUntil:
                  type: string
                  nullable: true
                datesHidden:
                  type: boolean
                  default: false
                  description: >-
                    Carried on a captured draft too, so somebody who ticked the box before being
                    bounced to sign in does not have the choice silently dropped when the draft
                    is promoted.
                draftToken:
                  type: string
                  format: uuid
                  description: Client-generated UUID linking this drop-off draft to a future authenticated submit for deduplication
      responses:
        '200':
          description: Drop-off review recorded
        '400':
          description: Invalid request

